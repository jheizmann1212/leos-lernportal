          <div class="merlix-tip-avatar">🧙‍♂️</div>
          <div class="merlix-tip-text"><strong>Merlix-Tipp:</strong> Sprich jedes Wort dreimal laut aus! So merkt sich dein Kopf die Wörter viel besser. Ready? Los geht's!</div>
        </div>
        <button class="main-btn orange-btn" onclick="engStep=1;render();window.scrollTo(0,0)">Ich hab die Wörter geübt! Weiter zum Quiz 🧠</button>`;
    }else{
      // Quiz
      const allAns=les.quiz.every((_,i)=>engQuizAnswers[i]!==undefined);
      let qH=les.quiz.map((q,qi)=>{
        const ans=engQuizAnswers[qi]!==undefined;const isC=engQuizSubmitted&&engQuizAnswers[qi]===q.c;const isW=engQuizSubmitted&&ans&&engQuizAnswers[qi]!==q.c;
        return `<div class="question-card ${engQuizSubmitted?(isC?'correct':isW?'wrong':''):''}">
          <div class="question-text">${qi+1}. ${q.q}</div>
          ${q.o.map((opt,oi)=>{const sel=engQuizAnswers[qi]===oi;const sC=engQuizSubmitted&&oi===q.c;const sW=engQuizSubmitted&&sel&&oi!==q.c;
            return `<button class="option-btn ${sC?'show-correct':sW?'show-wrong':sel?'selected':''}" ${engQuizSubmitted?'disabled':''} onclick="engSelectAnswer(${qi},${oi})">${sC?'✅ ':sW?'❌ ':''}${opt}</button>`;}).join('')}
        </div>`;}).join('');
      let bot='';
      if(!engQuizSubmitted){bot=`<div style="padding:0 24px"><button class="main-btn orange-btn" ${allAns?'':'disabled'} onclick="submitEngQuiz()">${allAns?'Antworten prüfen! ✨':'Beantworte alle Fragen...'}</button></div>`;}
      else{const cor=les.quiz.filter((q,i)=>engQuizAnswers[i]===q.c).length;
        bot=`<div class="score-summary ${cor===3?'perfect':cor>=2?'good':'tryagain'}"><div class="score-emoji">${cor===3?'🎉':cor>=2?'👍':'💪'}</div><div class="score-text" style="color:${cor===3?'var(--green)':cor>=2?'var(--gold)':'var(--orange)'}">${cor} von 3 richtig!</div></div>
          <div style="padding:0 24px;text-align:center;margin-top:14px"><button class="main-btn orange-btn" onclick="goBack()">Zurück 📅</button></div>`;}
      app.innerHTML=`<div class="topbar"><button class="back-btn" onclick="engStep=0;render()">← Wörter nochmal ansehen</button><div class="step-info">Quiz: ${les.title}</div></div>
        <div style="padding:0 24px 6px"><div class="quiz-title" style="color:var(--orange)">🇬🇧 Quiz: ${les.title}</div></div>${qH}${bot}`;
    }

  // ─── WISSEN VIEW ──────────────────────────────────────────────────────
  } else if(currentView==='wissen'){
    const q=wissenQuestions[wissenCurrent];
    const isDone=wissenCurrent>=wissenQuestions.length;
    const diffLabel=wissenDifficulty==='easy'?'🌟 Einfach':wissenDifficulty==='medium'?'⚡ Mittel':'🔥 Schwer';
    const diffColor=wissenDifficulty==='easy'?'var(--green)':wissenDifficulty==='medium'?'#0d9488':'var(--red)';
    const dots=wissenQuestions.map((_,i)=>{
      let cls='eng-pip';if(i<wissenCurrent)cls+=wissenQuestions[i].wasCorrect?' pip-done':' ';if(i===wissenCurrent&&!isDone)cls+=' pip-current';
      return `<div class="${cls}" style="${i<wissenCurrent&&!wissenQuestions[i].wasCorrect?'background:var(--red);border-color:var(--red)':''}"></div>`;
    }).join('');

    if(isDone){
      const stars=wissenScore>=5?3:wissenScore>=3?2:1;
      app.innerHTML=`<div class="topbar"><button class="back-btn" onclick="goBack()">← Zurück</button></div>
        <div style="text-align:center;padding:40px 24px">
          <div style="font-size:64px;margin-bottom:12px">${stars===3?'🎉':stars===2?'👍':'💪'}</div>
          <div style="font-family:'Fredoka One',cursive;font-size:28px;color:${stars===3?'var(--green)':stars===2?'var(--gold)':'var(--accent)'}">${wissenScore} von ${wissenQuestions.length} richtig!</div>
          <div style="font-size:14px;color:var(--text-dim);font-weight:700;margin-top:6px">${diffLabel}</div>
          <div class="stars-earned" style="margin:16px 0">${'⭐'.repeat(stars)}${'<span style="filter:grayscale(1) opacity(0.3)">⭐</span>'.repeat(3-stars)}</div>
          <button class="main-btn green-btn" style="width:calc(100% - 48px);margin:16px auto 0" onclick="goBack()">Zurück 📅</button>
        </div>`;
    } else {
      app.innerHTML=`<div class="topbar"><button class="back-btn" onclick="goBack()">← Zurück</button><div class="step-info">${diffLabel} – Frage ${wissenCurrent+1}/${wissenQuestions.length}</div></div>
        <div class="eng-progress" style="margin-top:8px">${dots}</div>
        <div style="text-align:center;font-size:52px;margin:12px 0 4px">${q.emoji||'🧠'}</div>
        <div style="padding:0 24px">
          <div style="font-family:'Fredoka One',cursive;font-size:20px;color:var(--text);text-align:center;margin-bottom:18px;line-height:1.4">${q.q}</div>
        </div>
        <div class="eng-options">
          ${q.o.map((opt,oi)=>{
            const sel=wissenSelected===oi;
            const sC=wissenAnswered&&oi===q.c;
            const sW=wissenAnswered&&sel&&oi!==q.c;
            return `<button class="eng-opt-btn ${sC?'eng-correct':sW?'eng-wrong':sel?'eng-selected':''}" style="border-color:${sC?'var(--green)':sW?'var(--red)':sel?diffColor:'rgba(34,197,94,0.15)'};${sC?'background:rgba(34,197,94,0.15)':sW?'background:rgba(248,113,113,0.15)':sel?'background:rgba(34,197,94,0.1)':''}" ${wissenAnswered?'disabled':''} onclick="wissenSelect(${oi})">${sC?'✅ ':sW?'❌ ':''}${opt}</button>`;
          }).join('')}
        </div>
        <div style="padding:0 24px;margin-top:14px">
          <button class="main-btn green-btn" onclick="${wissenAnswered?'wissenNext()':'wissenCheck()'}" ${!wissenAnswered&&wissenSelected===null?'disabled':''}>${wissenAnswered?'Nächste Frage →':'Prüfen!'}</button>
        </div>
        <div style="text-align:center;margin-top:10px;font-size:14px;font-weight:700;color:var(--text-dim)">${wissenScore} richtig bisher</div>`;
    }

  // ─── SCHREIBEN VIEW ───────────────────────────────────────────────────
  } else if(currentView==='schreib'){
    const w=schreibWords[schreibCurrent];
    const isDone=schreibCurrent>=schreibWords.length;
    const diffLabel=schreibDifficulty==='easy'?'✏️ Einfach':schreibDifficulty==='medium'?'📝 Mittel':'🧙‍♂️ Schwer';
    const dots=schreibWords.map((_,i)=>{
      let cls='eng-pip';if(i<schreibCurrent)cls+=schreibWords[i].wasCorrect?' pip-done':' ';if(i===schreibCurrent&&!isDone)cls+=' pip-current';
      return `<div class="${cls}" style="${i<schreibCurrent&&!schreibWords[i].wasCorrect?'background:var(--red);border-color:var(--red)':''}${i===schreibCurrent&&!isDone?'border-color:#ec4899;box-shadow:0 0 8px rgba(236,72,153,0.4)':''}"></div>`;
    }).join('');
    if(isDone){
      const stars=schreibScore>=6?3:schreibScore>=4?2:1;
      app.innerHTML=`<div class="topbar"><button class="back-btn" onclick="goBack()">← Zurück</button></div>
        <div style="text-align:center;padding:40px 24px">
          <div style="font-size:64px;margin-bottom:12px">${stars===3?'🎉':stars===2?'👍':'💪'}</div>
          <div style="font-family:'Fredoka One',cursive;font-size:28px;color:${stars===3?'var(--green)':stars===2?'var(--gold)':'#ec4899'}">${schreibScore} von ${schreibWords.length} richtig!</div>
          <div style="font-size:14px;color:var(--text-dim);font-weight:700;margin-top:6px">${diffLabel}</div>
          <div class="stars-earned" style="margin:16px 0">${'⭐'.repeat(stars)}${'<span style="filter:grayscale(1) opacity(0.3)">⭐</span>'.repeat(3-stars)}</div>
          <button class="main-btn pink-btn" style="width:calc(100% - 48px);margin:16px auto 0" onclick="goBack()">Zurück 📅</button>
        </div>`;
    } else {
      // Show letter boxes as hint for length
      const letterHint=w.word.split('').map((_,i)=>`<span style="display:inline-block;width:28px;height:36px;border-bottom:3px solid ${schreibChecked?(schreibCorrect?'var(--green)':'var(--red)'):'rgba(236,72,153,0.4)'};margin:0 2px;font-family:'Fredoka One',cursive;font-size:22px;color:${schreibChecked?(schreibCorrect?'var(--green)':'var(--red)'):'transparent'};line-height:36px">${schreibChecked?w.word[i]:'_'}</span>`).join('');

      let feedbackHTML='';
      if(schreibChecked){
        if(schreibCorrect){
          feedbackHTML=`<div style="text-align:center;margin-top:14px;font-size:18px;font-weight:800;color:var(--green)">✅ Perfekt! Richtig geschrieben!</div>`;
        } else {
          // Show what was wrong
          const userLetters=schreibInput.toLowerCase().split('');
          const correctLetters=w.word.toLowerCase().split('');
          let comparison='';
          for(let i=0;i<Math.max(userLetters.length,correctLetters.length);i++){
            const u=userLetters[i]||'';const c=correctLetters[i]||'';
            comparison+=`<span style="color:${u===c?'var(--green)':'var(--red)'};font-weight:800">${u||'_'}</span>`;
          }
          feedbackHTML=`<div style="text-align:center;margin-top:14px">
            <div style="font-size:16px;font-weight:800;color:var(--red)">❌ Fast! Du hast geschrieben: <span style="font-family:'Fredoka One',cursive;font-size:18px">${comparison}</span></div>
            <div style="font-size:16px;font-weight:800;color:var(--green);margin-top:6px">Richtig wäre: <span style="font-family:'Fredoka One',cursive;font-size:20px">${w.word}</span></div>
            ${schreibAttempts<2?'<div style="font-size:13px;color:var(--text-dim);margin-top:6px;font-weight:600">💡 Du hast noch einen Versuch!</div>':''}
          </div>`;
        }
      }

      app.innerHTML=`<div class="topbar"><button class="back-btn" onclick="goBack()">← Zurück</button><div class="step-info">${diffLabel} – Wort ${schreibCurrent+1}/${schreibWords.length}</div></div>
        <div class="eng-progress" style="margin-top:8px">${dots}</div>
        <div style="text-align:center;font-size:64px;margin:16px 0 4px">${w.img}</div>
        <div style="text-align:center;padding:0 24px">
          <div style="font-size:14px;color:#ec4899;font-weight:700;margin-bottom:4px">HINWEIS:</div>
          <div style="font-family:'Fredoka One',cursive;font-size:18px;color:var(--text);margin-bottom:12px">${w.hint}</div>
          <div style="margin-bottom:16px;letter-spacing:4px">${letterHint}</div>
          <div style="font-size:12px;color:var(--text-dim);font-weight:700;margin-bottom:8px">${w.word.length} Buchstaben</div>
        </div>
        <div style="padding:0 24px">
          <input type="text" id="schreibInput" value="${schreibInput}" 
            ${schreibChecked&&(schreibCorrect||schreibAttempts>=2)?'disabled':''}
            oninput="schreibInput=this.value" onkeydown="if(event.key==='Enter')schreibCheck()"
            placeholder="Tippe das Wort ein..."
            autocomplete="off" autocapitalize="off" spellcheck="false"
            style="width:100%;padding:16px;border-radius:14px;border:2px solid ${schreibChecked?(schreibCorrect?'var(--green)':'var(--red)'):'rgba(236,72,153,0.3)'};background:${schreibChecked?(schreibCorrect?'rgba(34,197,94,0.08)':'rgba(248,113,113,0.08)'):'rgba(255,255,255,0.06)'};color:#fff;font-family:'Fredoka One',cursive;font-size:24px;text-align:center;outline:none;transition:all 0.2s">
          ${feedbackHTML}
          <button class="main-btn pink-btn" style="margin-top:14px" onclick="${schreibChecked&&(schreibCorrect||schreibAttempts>=2)?'schreibNext()':'schreibCheck()'}">${schreibChecked&&(schreibCorrect||schreibAttempts>=2)?'Nächstes Wort →':(schreibChecked?'Nochmal versuchen!':'Prüfen!')}</button>
        </div>
        <div style="text-align:center;margin-top:10px;font-size:14px;font-weight:700;color:var(--text-dim)">${schreibScore} richtig bisher</div>`;
      if(!schreibChecked||(!schreibCorrect&&schreibAttempts<2))setTimeout(()=>{const inp=document.getElementById('schreibInput');if(inp){inp.focus();if(!schreibChecked)inp.setSelectionRange(inp.value.length,inp.value.length);}},100);
    }
  }
}

function renderReward(){
  const{score,total,type}=rewardData;
  const msgs=type==='math'?WIZ_MATH:type==='eng'?WIZ_ENG:type==='wissen'?WIZ_WISSEN:type==='schreib'?WIZ_SCHREIB:score===total?WIZ_PERFECT:score>=total-1?WIZ_GOOD:WIZ_TRY;
  const msg=pickRandom(msgs);
  let ov=document.getElementById('reward-overlay');
  if(!ov){ov=document.createElement('div');ov.id='reward-overlay';ov.className='reward-overlay';document.body.appendChild(ov);}
  const stars=type==='math'?(score>=7?3:score>=5?2:1):(score===total?3:score>=total-1?2:1);
  let stH='';for(let i=0;i<3;i++){stH+=`<div class="star-reward" style="animation-delay:${0.3+i*0.2}s;filter:${i<stars?'none':'grayscale(1) opacity(0.3)'}">⭐</div>`;}
  ov.innerHTML=`<div class="reward-box"><div class="wizard-big">🧙‍♂️</div><div class="wizard-speech"><div class="wizard-name">⚡ ZAUBERER MERLIX ⚡</div><div class="wizard-msg">${msg}</div><div class="wizard-sub">${stars===3?'🌟 Drei goldene Sterne! 🌟':stars===2?'⭐ '+stars+' Sterne!':'💪 Weiter üben!'}</div></div><div class="stars-earned">${stH}</div><button class="reward-dismiss" onclick="dismissReward()">${stars===3?'YEAH! Weiter! 🚀':'Weiter! ✨'}</button></div>`;
  setTimeout(()=>{if(stars===3){spawnConfetti(50);spawnStarBurst();setTimeout(()=>spawnConfetti(30),800);}else if(stars>=2){spawnStarBurst();spawnParticles(20,['#fbbf24','#a78bfa','#34d399']);}else{spawnParticles(12,['#a78bfa','#7c3aed','#c4b5fd']);}},400);
}

// ─── Instant Celebrations on Correct Answers ────────────────────────────
const CELEBRATION_EMOJIS=['🎉','🥳','💥','⚡','🌟','✨','💫','🔥','🎊','🪄'];
const MERLIX_CHEERS=['Ja!','Super!','Richtig!','Toll!','Wow!','Klasse!','Bravo!','Yeah!','Perfekt!','Magisch!'];
const MERLIX_DANCES=['wizDanceJump','wizDanceSpin','wizDanceWiggle','wizDanceFlip'];

function celebrateCorrect(intensity){
  // intensity: 1=single correct, 2=quiz good, 3=quiz perfect
  
  // Mini Merlix pops up and cheers
  const miniWiz=document.createElement('div');
  miniWiz.style.cssText=`position:fixed;z-index:1001;pointer-events:none;font-size:${40+intensity*15}px;left:${30+Math.random()*40}%;bottom:${60+Math.random()*100}px;animation:wizCelebPop ${0.8+intensity*0.3}s cubic-bezier(0.34,1.56,0.64,1) forwards;filter:drop-shadow(0 0 15px rgba(139,92,246,0.5));`;
  miniWiz.textContent='🧙‍♂️';
  document.body.appendChild(miniWiz);
  setTimeout(()=>miniWiz.remove(),2000+intensity*500);
  
  // Cheer text
  const cheer=document.createElement('div');
  cheer.className='merlix-spell';
  cheer.textContent=pickRandom(MERLIX_CHEERS)+(intensity>=2?' '+pickRandom(CELEBRATION_EMOJIS):'');
  cheer.style.cssText+=`left:${35+Math.random()*30}%;bottom:${130+intensity*30}px;font-size:${16+intensity*4}px;`;
  document.body.appendChild(cheer);
  setTimeout(()=>cheer.remove(),2500);
  
  // Particles
  spawnParticles(8+intensity*10,['#fbbf24','#7c3aed','#34d399','#60a5fa','#f472b6','#fb923c']);
  
  if(intensity>=2){
    // Confetti shower
    spawnConfetti(20+intensity*20);
    spawnStarBurst();
    // Bonus emoji rain
    const rainEmojis=intensity===3?['⭐','🌟','✨','💫','🎉','🏆']:['⭐','✨','💫'];
    for(let i=0;i<5+intensity*5;i++){
      const e=document.createElement('div');e.className='confetti';
      e.textContent=pickRandom(rainEmojis);
      e.style.cssText=`left:${Math.random()*100}%;top:-20px;background:transparent;font-size:${14+Math.random()*16}px;--dur:${1.5+Math.random()*2}s;--rot:${360+Math.random()*720}deg;animation-delay:${Math.random()*0.8}s;width:auto;height:auto;`;
      document.body.appendChild(e);setTimeout(()=>e.remove(),4000);
    }
  }
  
  if(intensity>=3){
    // MEGA celebration: screen flash, more confetti waves, random crazy effect
    setTimeout(()=>spawnConfetti(50),300);
    setTimeout(()=>spawnConfetti(40),700);
    setTimeout(()=>{spawnStarBurst();spawnParticles(30,['#fbbf24','#ef4444','#22c55e','#3b82f6','#ec4899']);},500);
    // Trigger a random crazy merlix effect
    setTimeout(()=>{
      const crazyEffects=['rainbow','diamonds','unicorn','explosion'];
      merlixCrazyEffect(pickRandom(crazyEffects));
    },800);
    // Screen flash
    const flash=document.createElement('div');
    flash.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;z-index:997;pointer-events:none;background:rgba(251,191,36,0.15);animation:flashBang 0.6s ease-out forwards;';
    if(!document.getElementById('flashStyle')){
      const fs=document.createElement('style');fs.id='flashStyle';
      fs.textContent='@keyframes flashBang{0%{opacity:1}100%{opacity:0}} @keyframes wizCelebPop{0%{transform:scale(0) rotate(-20deg) translateY(0);opacity:0}40%{transform:scale(1.4) rotate(10deg) translateY(-30px);opacity:1}60%{transform:scale(1.1) rotate(-5deg) translateY(-50px)}80%{transform:scale(1.2) rotate(3deg) translateY(-40px)}100%{transform:scale(0) rotate(15deg) translateY(-80px);opacity:0}}';
      document.head.appendChild(fs);
    } else if(!document.getElementById('celebPopStyle')){
      const cs=document.createElement('style');cs.id='celebPopStyle';
      cs.textContent='@keyframes wizCelebPop{0%{transform:scale(0) rotate(-20deg) translateY(0);opacity:0}40%{transform:scale(1.4) rotate(10deg) translateY(-30px);opacity:1}60%{transform:scale(1.1) rotate(-5deg) translateY(-50px)}80%{transform:scale(1.2) rotate(3deg) translateY(-40px)}100%{transform:scale(0) rotate(15deg) translateY(-80px);opacity:0}}';
      document.head.appendChild(cs);
    }
    document.body.appendChild(flash);
    setTimeout(()=>flash.remove(),800);
  }
}

window.submitQuiz=function(){
  const day=DAYS.find(d=>d.date===selectedDay);if(!day)return;quizSubmitted=true;
  const cor=day.quiz.filter((q,i)=>quizAnswers[i]===q.c).length;
  progress[selectedDay]={quizDone:true,score:cor,total:3};save();
  // Celebrate based on score!
  celebrateCorrect(cor===3?3:cor>=2?2:1);
  setTimeout(()=>{showReward=true;rewardData={score:cor,total:3,type:'read'};renderReward();render();},cor===3?1500:800);
};
window.dismissReward=function(){showReward=false;rewardData=null;const ov=document.getElementById('reward-overlay');if(ov)ov.remove();currentView='calendar';selectedDay=null;engLesson=null;render();window.scrollTo(0,0);};

// Math
window.startMath=function(){mathProblems=generateMathProblems();mathCurrent=0;mathScore=0;mathAnswered=false;mathUserAnswer='';currentView='math';render();};
window.checkMath=function(){
  if(mathAnswered||!mathUserAnswer)return;mathAnswered=true;
  const p=mathProblems[mathCurrent];const correct=parseInt(mathUserAnswer)===p.answer;
  p.wasCorrect=correct;if(correct){mathScore++;celebrateCorrect(1);}
  render();
};
window.nextMath=function(){
  mathCurrent++;mathAnswered=false;mathUserAnswer='';
  if(mathCurrent>=mathProblems.length){
    const stars=mathScore>=7?3:mathScore>=5?2:1;
    progress.mathCompleted=(progress.mathCompleted||0)+1;progress.mathStars=(progress.mathStars||0)+stars;save();
    celebrateCorrect(stars);
    setTimeout(()=>{showReward=true;rewardData={score:mathScore,total:mathProblems.length,type:'math'};renderReward();},stars===3?1500:800);
  }
  render();
};

// English
window.startEng=function(id){engLesson=ENG_LESSONS.find(l=>l.id===id);engStep=0;engQuizAnswers={};engQuizSubmitted=false;currentView='eng';render();window.scrollTo(0,0);};
window.engSelectAnswer=function(qi,oi){if(engQuizSubmitted)return;engQuizAnswers[qi]=oi;render();};
window.submitEngQuiz=function(){
  engQuizSubmitted=true;const les=engLesson;
  const cor=les.quiz.filter((q,i)=>engQuizAnswers[i]===q.c).length;
  if(!progress.engDone)progress.engDone={};progress.engDone[les.id]=true;
  progress.engStars=(progress.engStars||0)+(cor===3?3:cor>=2?2:1);save();
  celebrateCorrect(cor===3?3:cor>=2?2:1);
  setTimeout(()=>{showReward=true;rewardData={score:cor,total:3,type:'eng'};renderReward();render();},cor===3?1500:800);
};

// Wissen
window.startWissen=function(diff){
  wissenDifficulty=diff;
  const bank=diff==='easy'?WISSEN_EASY:diff==='medium'?WISSEN_MEDIUM:WISSEN_HARD;
  // Pick 5 random unique questions
  const shuffled=[...bank].sort(()=>Math.random()-0.5);
  wissenQuestions=shuffled.slice(0,5).map(q=>({...q,wasCorrect:false}));
  wissenCurrent=0;wissenScore=0;wissenAnswered=false;wissenSelected=null;
  currentView='wissen';render();window.scrollTo(0,0);
};
window.wissenSelect=function(oi){if(wissenAnswered)return;wissenSelected=oi;render();};
window.wissenCheck=function(){
  if(wissenAnswered||wissenSelected===null)return;wissenAnswered=true;
  const q=wissenQuestions[wissenCurrent];
  const correct=wissenSelected===q.c;q.wasCorrect=correct;
  if(correct){wissenScore++;celebrateCorrect(1);}
  render();
};
window.wissenNext=function(){
  wissenCurrent++;wissenAnswered=false;wissenSelected=null;
  if(wissenCurrent>=wissenQuestions.length){
    const stars=wissenScore>=5?3:wissenScore>=3?2:1;
    progress.wissenCompleted=(progress.wissenCompleted||0)+1;
    progress.wissenStars=(progress.wissenStars||0)+stars;save();
    celebrateCorrect(stars);
    setTimeout(()=>{showReward=true;rewardData={score:wissenScore,total:wissenQuestions.length,type:'wissen'};renderReward();},stars===3?1500:800);
  }
  render();window.scrollTo(0,0);
};

// Schreiben
window.startSchreib=function(diff){
  schreibDifficulty=diff;
  const bank=diff==='easy'?SCHREIB_EASY:diff==='medium'?SCHREIB_MEDIUM:SCHREIB_HARD;
  const shuffled=[...bank].sort(()=>Math.random()-0.5);
  schreibWords=shuffled.slice(0,6).map(w=>({...w,wasCorrect:false}));
  schreibCurrent=0;schreibScore=0;schreibInput='';schreibChecked=false;schreibCorrect=false;schreibAttempts=0;
  currentView='schreib';render();window.scrollTo(0,0);
};
window.schreibCheck=function(){
  if(!schreibInput.trim())return;
  const w=schreibWords[schreibCurrent];
  schreibCorrect=schreibInput.trim().toLowerCase()===w.word.toLowerCase();
  schreibChecked=true;schreibAttempts++;
  if(schreibCorrect){w.wasCorrect=true;schreibScore++;celebrateCorrect(1);}
  else if(schreibAttempts>=2){w.wasCorrect=false;}
  else{schreibChecked=true;} // show error but allow retry
  render();
};
window.schreibNext=function(){
  schreibCurrent++;schreibInput='';schreibChecked=false;schreibCorrect=false;schreibAttempts=0;
  if(schreibCurrent>=schreibWords.length){
    const stars=schreibScore>=6?3:schreibScore>=4?2:1;
    progress.schreibCompleted=(progress.schreibCompleted||0)+1;
    progress.schreibStars=(progress.schreibStars||0)+stars;save();
    celebrateCorrect(stars);
    setTimeout(()=>{showReward=true;rewardData={score:schreibScore,total:schreibWords.length,type:'schreib'};renderReward();},stars===3?1500:800);
  }
  render();window.scrollTo(0,0);
};

// ─── Stars & Init ───────────────────────────────────────────────────────
function createStars(){const sf=document.getElementById('starfield');for(let i=0;i<60;i++){const s=document.createElement('div');s.className='star';s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;--dur:${2+Math.random()*4}s;animation-delay:${Math.random()*3}s;width:${1+Math.random()*2}px;height:${1+Math.random()*2}px;opacity:${0.2+Math.random()*0.5};`;sf.appendChild(s);}}
createStars();
render();
scheduleMerlixWalk();
// First walk quickly, then another soon
setTimeout(merlixWalk,5000);
setTimeout(()=>{if(!document.querySelector('.merlix-walker'))merlixWalk();},18000);
</script>
