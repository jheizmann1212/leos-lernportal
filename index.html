<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Leos Lernportal 🧙‍♂️</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #0a0e1a;
  --bg-card: rgba(255,255,255,0.05);
  --accent: #8b5cf6;
  --accent-glow: rgba(139,92,246,0.4);
  --gold: #fbbf24;
  --gold-glow: rgba(251,191,36,0.4);
  --green: #34d399;
  --green-glow: rgba(52,211,153,0.3);
  --red: #f87171;
  --blue: #60a5fa;
  --blue-glow: rgba(96,165,250,0.3);
  --orange: #fb923c;
  --orange-glow: rgba(251,146,60,0.3);
  --text: #e2e8f0;
  --text-dim: #64748b;
  --wizard-purple: #a78bfa;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg-deep);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}
.starfield { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
.star { position:absolute; width:2px; height:2px; background:#fff; border-radius:50%; animation:twinkle var(--dur) ease-in-out infinite; }
@keyframes twinkle { 0%,100%{opacity:0.2} 50%{opacity:0.8} }

/* ─── Castle Background ─── */
.castle-bg {
  position:fixed; bottom:0; right:0; width:420px; height:auto;
  pointer-events:none; z-index:0; opacity:0.12;
  filter:drop-shadow(0 0 30px rgba(139,92,246,0.3));
}
/* Dragon background left */
.dragon-bg {
  position:fixed; bottom:0; left:-20px; width:380px; height:auto;
  pointer-events:none; z-index:0; opacity:0.1;
  filter:drop-shadow(0 0 30px rgba(139,92,246,0.3));
  transform:scaleX(-1);
}
.dragon-glow {
  position:fixed; bottom:-50px; left:-50px;
  width:450px; height:450px;
  background:radial-gradient(circle, rgba(124,58,237,0.06) 0%, rgba(124,58,237,0.02) 40%, transparent 70%);
  pointer-events:none; z-index:0;
}
/* Subtle glow behind castle */
.castle-glow {
  position:fixed; bottom:-50px; right:-50px;
  width:500px; height:500px;
  background:radial-gradient(circle, rgba(139,92,246,0.08) 0%, rgba(139,92,246,0.03) 40%, transparent 70%);
  pointer-events:none; z-index:0;
}
/* Moon */
.moon {
  position:fixed; top:60px; right:80px;
  width:70px; height:70px;
  background:radial-gradient(circle at 35% 35%, #fef3c7, #fbbf24, #f59e0b);
  border-radius:50%;
  box-shadow: 0 0 40px rgba(251,191,36,0.3), 0 0 80px rgba(251,191,36,0.1);
  pointer-events:none; z-index:0;
  opacity:0.6;
  animation: moonGlow 5s ease-in-out infinite;
}
@keyframes moonGlow {
  0%,100% { opacity:0.5; box-shadow: 0 0 40px rgba(251,191,36,0.2), 0 0 80px rgba(251,191,36,0.08); }
  50% { opacity:0.7; box-shadow: 0 0 50px rgba(251,191,36,0.35), 0 0 100px rgba(251,191,36,0.15); }
}
.app { position:relative; z-index:1; max-width:780px; margin:0 auto; padding-bottom:40px; }

/* ─── Header ─── */
.header {
  background: linear-gradient(160deg, #1e1b4b, #312e81, #1e1b4b);
  padding: 28px 24px 24px; border-radius: 0 0 28px 28px;
  position: relative; overflow: hidden;
  border-bottom: 2px solid rgba(139,92,246,0.3);
}
.header::before { content:''; position:absolute; top:-60px; right:-40px; width:200px; height:200px; background:radial-gradient(circle,rgba(139,92,246,0.15),transparent 70%); }
.header-title { font-family:'Fredoka One',cursive; font-size:30px; color:#fff; text-shadow:0 0 30px var(--accent-glow); }
.header-sub { font-size:15px; color:var(--wizard-purple); font-weight:700; margin-top:4px; }
.wizard-mini { position:absolute; top:16px; right:20px; font-size:52px; filter:drop-shadow(0 0 12px var(--accent-glow)); animation:wizFloat 3s ease-in-out infinite; cursor:pointer; }
@keyframes wizFloat { 0%,100%{transform:translateY(0) rotate(-5deg)} 50%{transform:translateY(-8px) rotate(5deg)} }
.stats { display:flex; gap:10px; margin-top:18px; }
.stat-card { flex:1; background:rgba(255,255,255,0.08); border-radius:14px; padding:10px 8px; text-align:center; border:1px solid rgba(255,255,255,0.06); }
.stat-num { font-size:26px; font-weight:900; }
.stat-label { font-size:11px; font-weight:700; color:var(--text-dim); margin-top:2px; }

/* ─── Tabs ─── */
.tabs { display:flex; gap:8px; padding:18px 24px 0; }
.tab-btn {
  flex:1; padding:14px 8px; border-radius:14px; border:2px solid rgba(255,255,255,0.08);
  background:var(--bg-card); color:var(--text-dim); font-family:'Nunito',sans-serif;
  font-size:14px; font-weight:800; cursor:pointer; text-align:center;
  transition:all 0.2s;
}
.tab-btn.active-read { background:rgba(139,92,246,0.15); border-color:var(--accent); color:var(--wizard-purple); }
.tab-btn.active-math { background:rgba(96,165,250,0.15); border-color:var(--blue); color:var(--blue); }
.tab-btn.active-eng { background:rgba(251,146,60,0.15); border-color:var(--orange); color:var(--orange); }
.tab-btn.active-wissen { background:rgba(34,197,94,0.15); border-color:var(--green); color:var(--green); }
.tab-btn.active-schreib { background:rgba(236,72,153,0.15); border-color:#ec4899; color:#ec4899; }
.tab-btn:hover:not(.active-read):not(.active-math):not(.active-eng) { border-color:rgba(255,255,255,0.15); }
.tab-emoji { font-size:22px; display:block; margin-bottom:4px; }

/* ─── Progress Bar ─── */
.progress-wrap { padding:18px 24px 0; }
.progress-bar { background:rgba(255,255,255,0.06); border-radius:10px; height:10px; overflow:hidden; }
.progress-fill { height:100%; border-radius:10px; transition:width 0.6s ease; }
.progress-fill.purple { background:linear-gradient(90deg,#7c3aed,#a78bfa,#c4b5fd,#a78bfa,#7c3aed); background-size:300% 100%; animation:pShimmer 3s ease infinite; }
.progress-fill.bluefill { background:linear-gradient(90deg,#3b82f6,#60a5fa,#93c5fd,#60a5fa,#3b82f6); background-size:300% 100%; animation:pShimmer 3s ease infinite; }
.progress-fill.orangefill { background:linear-gradient(90deg,#f97316,#fb923c,#fdba74,#fb923c,#f97316); background-size:300% 100%; animation:pShimmer 3s ease infinite; }
.progress-fill.greenfill { background:linear-gradient(90deg,#16a34a,#34d399,#6ee7b7,#34d399,#16a34a); background-size:300% 100%; animation:pShimmer 3s ease infinite; }
.progress-fill.pinkfill { background:linear-gradient(90deg,#db2777,#ec4899,#f9a8d4,#ec4899,#db2777); background-size:300% 100%; animation:pShimmer 3s ease infinite; }
.main-btn.pink-btn { background:linear-gradient(135deg,#db2777,#be185d); color:#fff; box-shadow:0 4px 20px rgba(236,72,153,0.3); }
@keyframes pShimmer { 0%{background-position:300% 0} 100%{background-position:0% 0} }
.progress-text { font-size:12px; color:var(--text-dim); font-weight:700; margin-top:5px; }

/* ─── Level Badge ─── */
.level-badge { margin:14px 24px 0; border-radius:14px; padding:12px 16px; display:flex; align-items:center; gap:12px; }
.level-badge.purple-badge { background:linear-gradient(135deg,rgba(139,92,246,0.1),rgba(139,92,246,0.03)); border:1px solid rgba(139,92,246,0.2); }
.level-badge.blue-badge { background:linear-gradient(135deg,rgba(96,165,250,0.1),rgba(96,165,250,0.03)); border:1px solid rgba(96,165,250,0.2); }
.level-badge.orange-badge { background:linear-gradient(135deg,rgba(251,146,60,0.1),rgba(251,146,60,0.03)); border:1px solid rgba(251,146,60,0.2); }
.level-icon { font-size:32px; }
.level-title { font-weight:800; font-size:14px; }
.level-desc { font-size:12px; color:var(--text-dim); font-weight:600; }

/* ─── Day & Item List ─── */
.section-title { font-family:'Fredoka One',cursive; font-size:19px; color:var(--wizard-purple); margin:18px 24px 10px; }
.section-title.blue-title { color:var(--blue); }
.section-title.orange-title { color:var(--orange); }
.section-title.green-title { color:var(--green); }
.level-badge.orange-badge { background:linear-gradient(135deg,rgba(251,146,60,0.1),rgba(251,146,60,0.03)); border:1px solid rgba(251,146,60,0.2); }
.level-badge.green-badge { background:linear-gradient(135deg,rgba(34,197,94,0.1),rgba(34,197,94,0.03)); border:1px solid rgba(34,197,94,0.2); }
.main-btn.green-btn { background:linear-gradient(135deg,#16a34a,#15803d); color:#fff; box-shadow:0 4px 20px var(--green-glow); }
.day-list { padding:0 24px; display:flex; flex-direction:column; gap:8px; }
.day-btn {
  display:flex; align-items:center; gap:12px; background:var(--bg-card);
  border:2px solid rgba(255,255,255,0.05); border-radius:14px; padding:13px 14px;
  cursor:pointer; width:100%; text-align:left; color:var(--text);
  font-family:'Nunito',sans-serif; transition:all 0.2s;
}
.day-btn:hover { border-color:rgba(139,92,246,0.3); background:rgba(139,92,246,0.08); transform:translateX(4px); }
.day-btn.done { background:rgba(34,197,94,0.06); border-color:rgba(34,197,94,0.2); }
.day-btn.today { border-color:var(--accent); box-shadow:0 0 20px var(--accent-glow); background:rgba(139,92,246,0.1); }
.day-emoji { font-size:26px; width:36px; text-align:center; flex-shrink:0; }
.day-info { flex:1; min-width:0; }
.day-date { font-size:12px; font-weight:700; color:var(--text-dim); }
.day-title { font-size:15px; font-weight:800; color:#f1f5f9; margin-top:1px; }
.day-badge-today { background:var(--accent); color:#fff; font-size:9px; font-weight:800; padding:2px 7px; border-radius:5px; margin-left:6px; text-transform:uppercase; letter-spacing:0.5px; }
.day-score { background:rgba(34,197,94,0.15); border-radius:8px; padding:5px 9px; font-size:12px; font-weight:800; color:var(--green); flex-shrink:0; }
.day-arrow { color:var(--accent); font-size:18px; font-weight:900; flex-shrink:0; }

/* ─── Topbar & Reading ─── */
.topbar { display:flex; align-items:center; padding:14px 20px; gap:10px; }
.back-btn { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:8px 14px; color:var(--wizard-purple); font-family:'Nunito',sans-serif; font-weight:800; font-size:13px; cursor:pointer; transition:all 0.2s; }
.back-btn:hover { background:rgba(139,92,246,0.15); }
.step-info { margin-left:auto; font-size:13px; font-weight:700; color:var(--text-dim); }
.reading-hero { text-align:center; font-size:52px; margin-bottom:6px; }
.reading-title { font-family:'Fredoka One',cursive; font-size:26px; color:var(--wizard-purple); text-align:center; }
.reading-date { text-align:center; color:var(--text-dim); font-size:13px; font-weight:700; margin-top:2px; }
.text-card { background:#ffffff; border:1px solid #e2e8f0; border-radius:18px; padding:30px 28px; margin:18px 24px 0; line-height:2.1; font-size:19px; font-weight:500; letter-spacing:0.015em; color:#1a1a1a; box-shadow:0 4px 24px rgba(0,0,0,0.1); }
.tip-card { background:rgba(251,191,36,0.07); border:1px solid rgba(251,191,36,0.15); border-radius:12px; padding:12px 16px; margin:14px 24px 0; display:flex; gap:10px; align-items:flex-start; }
.tip-card span:first-child { font-size:18px; }
.tip-card p { font-size:13px; color:var(--gold); font-weight:600; line-height:1.5; }
.main-btn { display:block; width:calc(100% - 48px); margin:22px 24px 0; border:none; border-radius:14px; padding:16px; font-family:'Nunito',sans-serif; font-size:17px; font-weight:800; cursor:pointer; transition:all 0.15s; }
.main-btn.purple-btn { background:linear-gradient(135deg,#7c3aed,#6d28d9); color:#fff; box-shadow:0 4px 20px var(--accent-glow); }
.main-btn.blue-btn { background:linear-gradient(135deg,#3b82f6,#2563eb); color:#fff; box-shadow:0 4px 20px var(--blue-glow); }
.main-btn.orange-btn { background:linear-gradient(135deg,#f97316,#ea580c); color:#fff; box-shadow:0 4px 20px var(--orange-glow); }
.main-btn:hover { transform:translateY(-1px); }
.main-btn:active { transform:scale(0.98); }
.main-btn:disabled { background:rgba(255,255,255,0.06); color:var(--text-dim); box-shadow:none; cursor:default; }

/* ─── Quiz ─── */
.quiz-title { font-family:'Fredoka One',cursive; font-size:22px; color:var(--wizard-purple); text-align:center; margin-bottom:18px; }
.question-card { background:var(--bg-card); border:2px solid rgba(255,255,255,0.05); border-radius:16px; padding:18px; margin:0 24px 12px; }
.question-card.correct { background:rgba(34,197,94,0.06); border-color:rgba(34,197,94,0.2); }
.question-card.wrong { background:rgba(248,113,113,0.06); border-color:rgba(248,113,113,0.2); }
.question-text { font-weight:800; font-size:15px; margin-bottom:12px; }
.option-btn { display:block; width:100%; background:rgba(255,255,255,0.05); border:2px solid transparent; border-radius:10px; padding:11px 14px; color:var(--text); font-family:'Nunito',sans-serif; font-size:14px; font-weight:600; text-align:left; cursor:pointer; margin-bottom:6px; transition:all 0.15s; }
.option-btn:hover:not(:disabled) { background:rgba(139,92,246,0.12); }
.option-btn.selected { background:rgba(139,92,246,0.2); border-color:var(--accent); }
.option-btn.show-correct { background:rgba(34,197,94,0.15); border-color:var(--green); }
.option-btn.show-wrong { background:rgba(248,113,113,0.15); border-color:var(--red); }

/* ─── Math Game ─── */
.math-area { padding:0 24px; }
.math-problem { text-align:center; margin:20px 0; }
.math-problem-text { font-family:'Fredoka One',cursive; font-size:48px; color:#fff; text-shadow:0 0 20px var(--blue-glow); }
.math-input-row { display:flex; justify-content:center; gap:12px; align-items:center; margin-top:16px; }
.math-input { width:120px; padding:14px; border-radius:14px; border:2px solid rgba(96,165,250,0.3); background:rgba(255,255,255,0.08); color:#fff; font-family:'Fredoka One',cursive; font-size:32px; text-align:center; outline:none; transition:border-color 0.2s; }
.math-input:focus { border-color:var(--blue); box-shadow:0 0 20px var(--blue-glow); }
.math-input.correct-input { border-color:var(--green); background:rgba(34,197,94,0.1); }
.math-input.wrong-input { border-color:var(--red); background:rgba(248,113,113,0.1); }
.math-score-bar { display:flex; justify-content:center; gap:8px; margin:16px 0; }
.math-dot { width:18px; height:18px; border-radius:50%; background:rgba(255,255,255,0.1); border:2px solid rgba(255,255,255,0.15); transition:all 0.3s; }
.math-dot.dot-correct { background:var(--green); border-color:var(--green); box-shadow:0 0 8px var(--green-glow); }
.math-dot.dot-wrong { background:var(--red); border-color:var(--red); }
.math-dot.dot-current { border-color:var(--blue); box-shadow:0 0 8px var(--blue-glow); }
.math-streak { text-align:center; font-size:14px; font-weight:700; color:var(--text-dim); margin-top:8px; }

/* ─── English ─── */
.eng-card {
  background:linear-gradient(135deg,rgba(251,146,60,0.08),rgba(251,146,60,0.02));
  border:2px solid rgba(251,146,60,0.15); border-radius:20px;
  padding:28px 24px; margin:0 24px; text-align:center;
}
.eng-word { font-family:'Fredoka One',cursive; font-size:44px; color:var(--orange); text-shadow:0 0 20px var(--orange-glow); }
.eng-phonetic { font-size:16px; color:var(--text-dim); font-weight:700; margin-top:4px; font-style:italic; }
.eng-meaning { font-size:18px; color:var(--text); font-weight:700; margin-top:12px; }
.eng-example { font-size:15px; color:var(--text-dim); font-weight:600; margin-top:6px; font-style:italic; }
.eng-illustration { font-size:64px; margin:16px 0; }
.eng-options { display:flex; flex-direction:column; gap:8px; margin:18px 24px 0; }
.eng-opt-btn { padding:14px 18px; border-radius:12px; border:2px solid rgba(251,146,60,0.15); background:rgba(255,255,255,0.04); color:var(--text); font-family:'Nunito',sans-serif; font-size:15px; font-weight:700; cursor:pointer; text-align:left; transition:all 0.15s; }
.eng-opt-btn:hover { border-color:rgba(251,146,60,0.3); background:rgba(251,146,60,0.08); }
.eng-opt-btn.eng-selected { border-color:var(--orange); background:rgba(251,146,60,0.15); }
.eng-opt-btn.eng-correct { border-color:var(--green); background:rgba(34,197,94,0.15); }
.eng-opt-btn.eng-wrong { border-color:var(--red); background:rgba(248,113,113,0.15); }
.eng-progress { display:flex; gap:6px; justify-content:center; margin:14px 0; }
.eng-pip { width:14px; height:14px; border-radius:50%; background:rgba(255,255,255,0.1); border:2px solid rgba(255,255,255,0.15); transition:all 0.3s; }
.eng-pip.pip-done { background:var(--orange); border-color:var(--orange); }
.eng-pip.pip-current { border-color:var(--orange); box-shadow:0 0 8px var(--orange-glow); }

/* ─── Merlix Walking ─── */
.merlix-walker {
  position:fixed; z-index:999; font-size:60px;
  pointer-events:none; filter:drop-shadow(0 0 20px var(--accent-glow));
  transition:none;
}
/* Bottom walk left to right */
@keyframes wizWalkBottom {
  0% { left:-80px; bottom:20px; top:auto; transform:scaleX(1) translateY(0); }
  10% { transform:scaleX(1) translateY(-12px); }
  20% { transform:scaleX(1) translateY(0); }
  30% { transform:scaleX(1) translateY(-12px); }
  40% { transform:scaleX(1) translateY(0); }
  48% { left:calc(50% - 30px); transform:scaleX(1) translateY(0); }
  52% { left:calc(50% - 30px); transform:scaleX(1) translateY(-25px) rotate(15deg); }
  56% { left:calc(50% - 30px); transform:scaleX(1) translateY(0) rotate(-8deg); }
  60% { left:calc(50% - 30px); transform:scaleX(1) translateY(0); }
  70% { transform:scaleX(1) translateY(-12px); }
  80% { transform:scaleX(1) translateY(0); }
  90% { transform:scaleX(1) translateY(-12px); }
  100% { left:calc(100% + 80px); bottom:20px; transform:scaleX(1) translateY(0); }
}
/* Top swoosh right to left */
@keyframes wizWalkTop {
  0% { right:-80px; top:60px; bottom:auto; left:auto; transform:scaleX(-1) translateY(0); }
  15% { transform:scaleX(-1) translateY(15px); }
  30% { transform:scaleX(-1) translateY(-15px); }
  45% { right:calc(50% - 30px); transform:scaleX(-1) translateY(0) rotate(-10deg); }
  50% { right:calc(50% - 30px); transform:scaleX(-1) translateY(-30px) rotate(20deg) scale(1.3); }
  55% { right:calc(50% - 30px); transform:scaleX(-1) translateY(0) rotate(-5deg) scale(1); }
  70% { transform:scaleX(-1) translateY(10px); }
  85% { transform:scaleX(-1) translateY(-10px); }
  100% { right:calc(100% + 80px); top:60px; transform:scaleX(-1) translateY(0); }
}
/* Diagonal: top-left to bottom-right */
@keyframes wizWalkDiag {
  0% { left:-80px; top:-80px; bottom:auto; transform:rotate(-20deg) scale(0.8); }
  20% { transform:rotate(5deg) scale(1); }
  40% { transform:rotate(-10deg) scale(1.1); }
  50% { left:calc(50% - 30px); top:calc(50% - 30px); transform:rotate(15deg) scale(1.4); }
  60% { transform:rotate(-5deg) scale(1); }
  80% { transform:rotate(10deg) scale(0.9); }
  100% { left:calc(100% + 80px); top:calc(100% + 80px); transform:rotate(0deg) scale(0.7); }
}
/* Bounce across */
@keyframes wizBounce {
  0% { left:-80px; bottom:20px; top:auto; transform:translateY(0); }
  12% { transform:translateY(-120px) rotate(20deg); }
  24% { left:20%; transform:translateY(0) rotate(0deg); }
  36% { transform:translateY(-100px) rotate(-15deg); }
  48% { left:40%; transform:translateY(0) rotate(5deg); }
  55% { left:calc(50% - 30px); transform:translateY(-150px) rotate(25deg) scale(1.3); }
  65% { left:60%; transform:translateY(0) rotate(-10deg) scale(1); }
  76% { transform:translateY(-80px) rotate(15deg); }
  88% { left:80%; transform:translateY(0) rotate(0deg); }
  100% { left:calc(100% + 80px); bottom:20px; transform:translateY(0); }
}
/* Zoom through center */
@keyframes wizZoom {
  0% { left:-100px; top:calc(50% - 40px); bottom:auto; transform:scale(0.3) rotate(-30deg); opacity:0.5; }
  30% { transform:scale(0.8) rotate(10deg); opacity:1; }
  50% { left:calc(50% - 40px); transform:scale(2) rotate(0deg); }
  70% { transform:scale(0.8) rotate(-10deg); opacity:1; }
  100% { left:calc(100% + 100px); transform:scale(0.3) rotate(30deg); opacity:0.5; }
}
/* Monster chase! Merlix runs from a monster */
.monster-chaser {
  position:fixed; z-index:998; font-size:55px;
  pointer-events:none; filter:drop-shadow(0 0 15px rgba(239,68,68,0.5));
}
@keyframes monsterChase {
  0% { left:-120px; bottom:20px; top:auto; transform:scaleX(1); }
  100% { left:calc(100% + 120px); bottom:20px; transform:scaleX(1); }
}
@keyframes wizRunScared {
  0% { left:-40px; bottom:20px; top:auto; transform:scaleX(1) translateY(0) rotate(0deg); }
  10% { transform:scaleX(1) translateY(-15px) rotate(-10deg); }
  20% { transform:scaleX(1) translateY(0) rotate(5deg); }
  30% { transform:scaleX(1) translateY(-20px) rotate(-8deg); }
  40% { transform:scaleX(1) translateY(0) rotate(3deg); }
  50% { left:calc(50% - 30px); transform:scaleX(1) translateY(-25px) rotate(-15deg); }
  60% { transform:scaleX(1) translateY(0) rotate(10deg); }
  70% { transform:scaleX(1) translateY(-15px) rotate(-5deg); }
  80% { transform:scaleX(1) translateY(0) rotate(3deg); }
  100% { left:calc(100% + 80px); bottom:20px; transform:scaleX(1) translateY(0); }
}
/* Merlix summons a friend */
.summoned-creature {
  position:fixed; z-index:998; pointer-events:none;
  animation:creatureAppear 3s ease forwards;
}
@keyframes creatureAppear {
  0% { transform:scale(0) rotate(-180deg); opacity:0; }
  30% { transform:scale(1.5) rotate(20deg); opacity:1; }
  50% { transform:scale(1.2) rotate(-10deg); }
  70% { transform:scale(1.3) rotate(5deg); }
  100% { transform:scale(0) rotate(180deg); opacity:0; }
}
.merlix-spell {
  position:fixed; z-index:998; font-family:'Fredoka One',cursive;
  font-size:18px; color:var(--gold); pointer-events:none;
  text-shadow:0 0 10px var(--gold-glow);
  animation:spellFloat 2.5s ease-out forwards;
}
@keyframes spellFloat {
  0% { opacity:1; transform:translateY(0) scale(1); }
  100% { opacity:0; transform:translateY(-100px) scale(1.5); }
}

/* ─── Wizard Reward Overlay ─── */
.reward-overlay { position:fixed; top:0; left:0; width:100%; height:100%; z-index:1000; display:flex; align-items:center; justify-content:center; background:rgba(10,14,26,0.92); backdrop-filter:blur(8px); animation:fadeIn 0.4s ease; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.reward-box { text-align:center; padding:20px; max-width:420px; width:90%; animation:rewardPop 0.6s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes rewardPop { from{transform:scale(0.5) translateY(40px);opacity:0} to{transform:scale(1) translateY(0);opacity:1} }
.wizard-big { font-size:100px; animation:wizEntrance 1s ease; filter:drop-shadow(0 0 40px var(--accent-glow)); }
@keyframes wizEntrance { 0%{transform:scale(0) rotate(-180deg);opacity:0} 60%{transform:scale(1.2) rotate(10deg)} 100%{transform:scale(1) rotate(0);opacity:1} }
.wizard-speech { background:linear-gradient(135deg,#312e81,#1e1b4b); border:2px solid rgba(139,92,246,0.4); border-radius:20px; padding:24px 20px; margin-top:16px; position:relative; box-shadow:0 0 40px var(--accent-glow); }
.wizard-speech::before { content:''; position:absolute; top:-10px; left:50%; transform:translateX(-50%); border-left:10px solid transparent; border-right:10px solid transparent; border-bottom:10px solid rgba(139,92,246,0.4); }
.wizard-name { font-family:'Fredoka One',cursive; font-size:14px; color:var(--wizard-purple); margin-bottom:6px; letter-spacing:1px; }
.wizard-msg { font-size:20px; font-weight:800; line-height:1.4; color:#fff; }
.wizard-sub { font-size:14px; color:var(--wizard-purple); font-weight:700; margin-top:8px; }
.stars-earned { margin-top:18px; display:flex; justify-content:center; gap:6px; }
.star-reward { font-size:36px; animation:starPop 0.5s cubic-bezier(0.34,1.56,0.64,1) both; }
@keyframes starPop { from{transform:scale(0) rotate(-30deg)} to{transform:scale(1) rotate(0)} }
.reward-dismiss { margin-top:20px; background:linear-gradient(135deg,var(--gold),#f59e0b); border:none; border-radius:14px; padding:14px 32px; font-family:'Nunito',sans-serif; font-size:16px; font-weight:800; color:#1e1b4b; cursor:pointer; box-shadow:0 4px 20px var(--gold-glow); transition:all 0.15s; }
.reward-dismiss:hover { transform:scale(1.03); }

/* ─── Particles & Confetti ─── */
.particle { position:fixed; pointer-events:none; z-index:1001; border-radius:50%; animation:particleFly var(--dur) ease-out forwards; }
@keyframes particleFly { 0%{transform:translate(0,0) scale(1);opacity:1} 100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0} }
.confetti { position:fixed; pointer-events:none; z-index:1002; width:8px; height:14px; animation:confettiFall var(--dur) ease-in forwards; }
@keyframes confettiFall { 0%{transform:translateY(-20px) rotate(0deg);opacity:1} 100%{transform:translateY(100vh) rotate(var(--rot));opacity:0} }

/* ─── Score Summary ─── */
.score-summary { margin:0 24px; text-align:center; border-radius:18px; padding:26px; border:2px solid; }
.score-summary.perfect { background:linear-gradient(135deg,rgba(34,197,94,0.1),rgba(34,197,94,0.03)); border-color:rgba(34,197,94,0.25); }
.score-summary.good { background:linear-gradient(135deg,rgba(251,191,36,0.1),rgba(251,191,36,0.03)); border-color:rgba(251,191,36,0.25); }
.score-summary.tryagain { background:linear-gradient(135deg,rgba(139,92,246,0.1),rgba(139,92,246,0.03)); border-color:rgba(139,92,246,0.25); }
.score-emoji { font-size:48px; margin-bottom:6px; }
.score-text { font-family:'Fredoka One',cursive; font-size:22px; }
.score-sub { font-size:13px; color:var(--text-dim); font-weight:600; margin-top:4px; }

@keyframes firePulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
.fire-anim { display:inline-block; animation:firePulse 1s ease-in-out infinite; }

/* ─── Merlix Tip Bubble ─── */
.merlix-tip {
  margin:14px 24px 0; padding:16px 18px; border-radius:16px;
  background:linear-gradient(135deg,rgba(139,92,246,0.12),rgba(139,92,246,0.04));
  border:1px solid rgba(139,92,246,0.2);
  display:flex; gap:12px; align-items:flex-start;
}
.merlix-tip-avatar { font-size:36px; flex-shrink:0; animation:wizFloat 3s ease-in-out infinite; }
.merlix-tip-text { font-size:14px; font-weight:600; color:var(--wizard-purple); line-height:1.5; }
.merlix-tip-text strong { color:#fff; }
</style>
</head>

  { date:"2026-03-10", title:"Mein Fahrrad", emoji:"🚲",
    text:"Leo hat ein blaues Fahrrad. Es hat eine silberne Klingel, einen Korb vorne dran und hinten ein rotes Rücklicht. Papa hat das Fahrrad letztes Jahr zum Geburtstag geschenkt. Jeden Tag fährt Leo damit zur Schule. Der Weg ist nicht weit, aber es macht trotzdem Spaß. Zuerst geht es einen kleinen Hügel hinauf. Das ist ein bisschen anstrengend, aber Leo tritt kräftig in die Pedale. Oben angekommen kann er den Hügel hinunter rollen. Der Wind weht ihm ins Gesicht und er fühlt sich frei. Das macht am meisten Spaß! Am Nachmittag fährt Leo manchmal zum Spielplatz. Dort trifft er seine Freunde Tom und Mia. Sie fahren gemeinsam um die Wette. Manchmal bauen sie auch einen Parcours aus Stöcken und fahren im Slalom hindurch. Leo achtet immer auf die Verkehrsregeln. Er fährt auf dem Radweg und schaut an jeder Kreuzung nach links und rechts. Seinen Helm trägt er natürlich auch immer. Papa sagt: Sicherheit geht vor! Abends stellt Leo sein Fahrrad in die Garage und schließt es ab.",
    quiz:[{q:"Welche Farbe hat Leos Fahrrad?",o:["Rot","Grün","Blau"],c:2},{q:"Was machen Leo und seine Freunde auf dem Spielplatz?",o:["Sie malen Bilder","Sie fahren um die Wette und Slalom","Sie spielen Fußball"],c:1},{q:"Was trägt Leo beim Fahrradfahren immer?",o:["Eine Sonnenbrille","Handschuhe","Einen Helm"],c:2}]},
  { date:"2026-03-11", title:"Woher kommt das Wasser?", emoji:"💧",
    text:"Wasser ist überall um uns herum. Es fließt in Flüssen und Bächen. Es liegt als Schnee auf den hohen Bergen. Und es schwimmt als Wolke hoch oben am Himmel. Aber woher kommt das ganze Wasser eigentlich? Das Wasser auf unserer Erde ist immer dasselbe Wasser. Es wird nie weniger und nie mehr. Es wandert nur immer im Kreis herum. Das funktioniert so: Die Sonne erwärmt das Wasser im Meer und in den Seen. Dann steigt es als unsichtbarer Dampf nach oben in die Luft. Oben in der Höhe wird es kalt. Der Dampf verwandelt sich wieder zurück in winzig kleine Wassertropfen. Ganz viele dieser Tropfen zusammen bilden eine Wolke. Wenn die Wolken immer voller und schwerer werden, fällt das Wasser als Regen herunter auf die Erde. Im Winter, wenn es sehr kalt ist, fällt es als Schnee. Das Regenwasser fließt in kleine Bäche. Die Bäche fließen in Flüsse. Die Flüsse fließen ins Meer. Und dort beginnt alles von vorne. Das nennt man den Wasserkreislauf. Er hört nie auf. Das Wasser, das du heute trinkst, war vielleicht vor langer Zeit ein Teil eines Ozeans oder sogar einer Wolke!",
    quiz:[{q:"Wird das Wasser auf der Erde mehr oder weniger?",o:["Es wird mehr","Es wird weniger","Es bleibt gleich"],c:2},{q:"Was passiert mit dem Wasserdampf oben in der Höhe?",o:["Er verschwindet","Er wird wieder zu kleinen Tropfen","Er wird zu Eis"],c:1},{q:"Wie heißt der Kreislauf des Wassers?",o:["Wasserrutsche","Wasserkreislauf","Wasserleitung"],c:1}]},
  { date:"2026-03-12", title:"Der Frosch am Teich", emoji:"🐸",
    text:"Am kleinen Teich im Park sitzt ein grüner Frosch auf einem großen Seerosenblatt. Er heißt Quaki. Quaki kann sehr weit springen. Seine langen, kräftigen Hinterbeine helfen ihm dabei. Manche Frösche können über einen Meter weit springen. Das ist mehr als das Zwanzigfache ihrer eigenen Körperlänge. Wenn Quaki Hunger hat, fängt er Fliegen und Mücken mit seiner langen, klebrigen Zunge. Die Zunge schießt blitzschnell aus dem Maul heraus und klebt das Insekt fest. Das ganze dauert weniger als eine Sekunde. Quaki kann gleichzeitig an Land und im Wasser leben. An Land atmet er mit seiner Lunge. Aber unter Wasser kann er auch durch seine Haut atmen. Die Haut muss dafür immer feucht sein. Deshalb sind Frösche so gerne in der Nähe von Wasser. Im Frühling legt Quakis Mama viele hundert Eier ins Wasser. Die Eier sehen aus wie kleine durchsichtige Kügelchen mit einem schwarzen Punkt in der Mitte. Daraus werden erst Kaulquappen. Die haben einen langen Schwanz und keine Beine. Sie sehen eher wie kleine Fische aus. Langsam wachsen ihnen erst die Hinterbeine, dann die Vorderbeine. Der Schwanz wird immer kürzer. Am Ende sind sie richtige kleine Frösche. Diese Verwandlung dauert ungefähr zwölf Wochen.",
    quiz:[{q:"Wie atmet der Frosch unter Wasser?",o:["Mit der Lunge","Durch seine Haut","Mit Kiemen"],c:1},{q:"Wie schnell fängt der Frosch eine Fliege?",o:["In einer Minute","In weniger als einer Sekunde","In zehn Sekunden"],c:1},{q:"Wie lange dauert die Verwandlung von Kaulquappe zum Frosch?",o:["Einen Tag","Ungefähr zwölf Wochen","Ein ganzes Jahr"],c:1}]},
  { date:"2026-03-13", title:"Die vier Jahreszeiten", emoji:"🍂",
    text:"Ein Jahr hat vier Jahreszeiten. Jede Jahreszeit dauert ungefähr drei Monate. Im Frühling wird es endlich wieder wärmer nach dem kalten Winter. Die Tage werden länger und die Sonne scheint öfter. Die ersten Blumen blühen: Krokusse, Tulpen und Narzissen. Die Vögel kommen aus dem Süden zurück und bauen ihre Nester. Im Sommer ist es richtig heiß. Die Tage sind lang und man kann bis abends draußen spielen. Im Sommer kann man schwimmen gehen, Eis essen und barfuß durch das Gras laufen. Die Bäume tragen jetzt Früchte. Kirschen, Äpfel und Birnen werden reif. Dann kommt der Herbst. Die Blätter an den Bäumen färben sich bunt: gelb, orange und rot. Dann fallen sie von den Bäumen herunter. Der Wind weht stärker und es wird kühler. Viele Tiere bereiten sich auf den Winter vor. Die Eichhörnchen sammeln Nüsse und die Zugvögel fliegen in den warmen Süden. Im Winter wird es kalt. Manchmal schneit es und die Welt sieht aus wie ein Winterwunderland. Die Kinder bauen Schneemänner und fahren Schlitten. Die Bäume haben keine Blätter mehr. Viele Tiere halten Winterschlaf. Jede Jahreszeit ist besonders und schön auf ihre eigene Art.",
    quiz:[{q:"Wie lange dauert ungefähr eine Jahreszeit?",o:["Einen Monat","Drei Monate","Sechs Monate"],c:1},{q:"Was machen viele Vögel im Herbst?",o:["Sie bauen Nester","Sie fliegen in den Süden","Sie lernen schwimmen"],c:1},{q:"Welche Blumen blühen im Frühling?",o:["Sonnenblumen","Krokusse, Tulpen und Narzissen","Rosen"],c:1}]},
  { date:"2026-03-14", title:"Die Planeten", emoji:"🪐",
    text:"Unsere Erde ist ein Planet. Sie kreist in einem großen Bogen um die Sonne. Für eine Runde braucht sie genau ein Jahr. Aber die Erde ist nicht allein auf ihrer Reise. Es gibt noch sieben andere Planeten, die ebenfalls um die Sonne kreisen. Merkur ist der kleinste Planet und am nächsten an der Sonne. Dort ist es tagsüber sehr heiß und nachts eiskalt. Venus ist der zweite Planet. Sie leuchtet besonders hell am Himmel und wird deshalb auch Abendstern genannt. Nach der Erde kommt Mars. Er sieht rot aus, weil sein Boden viel rostiges Eisen enthält. Manche Forscher träumen davon, eines Tages zum Mars zu reisen. Jupiter ist der fünfte Planet und der größte von allen. Er ist so riesig, dass mehr als tausend Erden in ihn hineinpassen würden! Jupiter hat einen großen roten Fleck. Das ist ein Sturm, der schon seit Hunderten von Jahren tobt. Saturn ist berühmt für seine wunderschönen Ringe. Die Ringe bestehen aus Milliarden kleiner Eis- und Gesteinsbrocken. Uranus und Neptun sind die beiden äußersten Planeten. Sie sind sehr weit weg und eisig kalt. Neptun ist so weit von der Sonne entfernt, dass er für eine einzige Runde um die Sonne hundertfünfundsechzig Jahre braucht. Alle acht Planeten zusammen bilden unser Sonnensystem.",
    quiz:[{q:"Warum sieht der Mars rot aus?",o:["Weil er heiß ist","Wegen rostigem Eisen im Boden","Weil die Sonne ihn rot anstrahlt"],c:1},{q:"Woraus bestehen die Ringe des Saturn?",o:["Aus Wolken","Aus Eis und Gestein","Aus Gas"],c:1},{q:"Wie viele Erden würden in den Jupiter passen?",o:["Zehn","Hundert","Mehr als tausend"],c:2}]},
  { date:"2026-03-15", title:"Der Schmetterling", emoji:"🦋", text:"Ein Schmetterling war nicht immer ein Schmetterling. Seine Verwandlung ist eines der größten Wunder der Natur. Alles beginnt mit einem winzigen Ei. Das Ei ist so klein wie ein Stecknadelkopf. Die Schmetterlings-Mama klebt es an die Unterseite eines Blattes. Nach ein paar Tagen schlüpft eine kleine Raupe aus dem Ei. Die Raupe hat nur eine Aufgabe: fressen, fressen, fressen! Sie frisst Blätter und wird jeden Tag dicker und größer. Manche Raupen fressen so viel, dass sie in zwei Wochen ihr Gewicht um das Tausendfache steigern. Die Raupe häutet sich dabei mehrmals, weil ihr die alte Haut zu eng wird. Wenn die Raupe groß genug ist, passiert etwas Erstaunliches. Sie hängt sich an einen Ast und spinnt sich in eine feste Hülle ein. Man nennt das eine Puppe oder einen Kokon. Von außen sieht es aus, als würde nichts passieren. Aber drinnen geschieht ein Wunder. Der ganze Körper der Raupe löst sich auf und baut sich völlig neu zusammen. Es entstehen Flügel, lange dünne Beine und ein Saugrüssel. Nach ungefähr zwei Wochen ist die Verwandlung fertig. Die Hülle bricht auf und ein wunderschöner Schmetterling kriecht heraus. Seine Flügel sind anfangs noch nass und zerknittert. Er muss sie erst in der Sonne trocknen lassen. Dann breitet er seine bunten Flügel aus und fliegt zum ersten Mal davon.", quiz:[{q:"Wie schwer kann eine Raupe im Vergleich zu ihrem Anfangsgewicht werden?",o:["Doppelt so schwer","Zehnmal so schwer","Tausendmal so schwer"],c:2},{q:"Was passiert im Kokon mit dem Körper der Raupe?",o:["Sie schläft nur","Der Körper löst sich auf und baut sich neu auf","Die Flügel wachsen einfach dran"],c:1},{q:"Warum kann der Schmetterling nach dem Schlüpfen nicht sofort fliegen?",o:["Er hat Hunger","Seine Flügel sind noch nass","Er hat Angst"],c:1}]},
  { date:"2026-03-16", title:"Der Bäcker", emoji:"🍞", text:"Herr Meier ist Bäcker. Das ist sein Traumberuf. Er steht jeden Morgen schon um drei Uhr nachts auf, wenn die meisten Menschen noch tief schlafen. In der Backstube ist es warm und es riecht nach Mehl. Zuerst wiegt Herr Meier alle Zutaten genau ab: Mehl, Wasser, Hefe und Salz. Die Hefe ist besonders wichtig. Sie ist ein winziger Pilz, der den Teig aufgehen lässt. Ohne Hefe wäre das Brot flach und hart. Herr Meier knetet den Teig mit seinen starken Händen. Manchmal hilft auch eine große Knetmaschine. Dann muss der Teig ruhen. Die Hefe arbeitet jetzt und macht kleine Gasbläschen. Davon wird der Teig immer größer. Das dauert ungefähr eine Stunde. Danach formt Herr Meier den Teig zu Broten, Brötchen und Brezeln. Er kann sogar kleine Tiere aus Teig formen. Die Kinder lieben das! Dann kommen die Brote in den großen Ofen. Dort ist es zweihundertfünfzig Grad heiß. Im Ofen werden die Brote knusprig und golden braun. Das ganze Haus duftet jetzt herrlich. Wenn die Kinder am Morgen zur Schule gehen, liegt das frische Brot schon in der Auslage. Herr Meier lächelt, wenn er sieht, wie sich die Leute über das warme Brot freuen. Das ist der beste Teil seines Tages.", quiz:[{q:"Warum ist Hefe so wichtig für das Brot?",o:["Sie macht es süß","Sie lässt den Teig aufgehen","Sie macht es braun"],c:1},{q:"Wie heiß ist es ungefähr im Backofen?",o:["Hundert Grad","Zweihundertfünfzig Grad","Fünfhundert Grad"],c:1},{q:"Wann steht der Bäcker morgens auf?",o:["Um sechs Uhr","Um drei Uhr nachts","Um Mitternacht"],c:1}]},
  { date:"2026-03-17", title:"Die Eichhörnchen", emoji:"🐿️", text:"Im Wald leben viele Eichhörnchen. Sie haben buschige Schwänze und können unglaublich gut klettern. Ihr Schwanz ist dabei sehr wichtig. Er hilft ihnen, das Gleichgewicht zu halten, wenn sie von Ast zu Ast springen. Außerdem benutzen sie ihn wie eine warme Decke im Winter. Mit ihren scharfen, gebogenen Krallen halten sie sich an der Baumrinde fest. Sie können sogar kopfüber den Baumstamm hinunterklettern. Das können die meisten anderen Tiere nicht. Eichhörnchen haben auch sehr gute Augen. Sie können Gefahren schon von weit weg erkennen. Im Herbst beginnt die wichtigste Arbeit: Eichhörnchen sammeln fleißig Nüsse, Eicheln und Bucheckern. Die verstecken sie an vielen verschiedenen Stellen im Boden. Manche Eichhörnchen legen bis zu tausend Verstecke an! Im Winter, wenn es kalt ist und kein Futter mehr wächst, graben sie die Nüsse wieder aus. Dabei hilft ihnen ihr guter Geruchssinn. Selbst unter einer Schicht Schnee können sie die Nüsse riechen. Aber manchmal vergessen sie trotzdem, wo sie etwas versteckt haben. Aus diesen vergessenen Nüssen wachsen dann im Frühling neue Bäume! So helfen die Eichhörnchen, ohne es zu wissen, dem Wald beim Wachsen. In Deutschland gibt es rote und braune Eichhörnchen. Beide Farben gehören zur gleichen Art.", quiz:[{q:"Wofür benutzt das Eichhörnchen seinen Schwanz?",o:["Nur zum Schönaussehen","Zum Gleichgewichthalten und als Decke","Zum Graben"],c:1},{q:"Wie viele Verstecke kann ein Eichhörnchen anlegen?",o:["Ungefähr zehn","Bis zu hundert","Bis zu tausend"],c:2},{q:"Wie finden Eichhörnchen ihre Nüsse unter dem Schnee?",o:["Sie erinnern sich an jeden Platz","Mit ihrem Geruchssinn","Sie sehen die Nüsse durch den Schnee"],c:1}]},
  { date:"2026-03-18", title:"Der Körper", emoji:"❤️", text:"Unser Körper ist ein wahres Wunderwerk. Alles arbeitet zusammen, damit wir leben, spielen und lernen können. Das Herz ist dabei der wichtigste Muskel. Es pumpt das Blut durch den ganzen Körper. Jeden Tag schlägt das Herz ungefähr hunderttausend Mal. Dabei pumpt es so viel Blut, dass man damit ein ganzes Schwimmbecken füllen könnte. Das Blut transportiert Sauerstoff und Nährstoffe zu allen Teilen des Körpers. Die Lunge hilft uns beim Atmen. Wir atmen frische Luft mit Sauerstoff ein. Den Sauerstoff braucht unser Körper, um zu funktionieren. Die verbrauchte Luft atmen wir dann wieder aus. Pro Tag atmen wir ungefähr zwanzigtausend Mal ein und aus. Unsere Knochen geben dem Körper sein Gerüst und seinen Halt. Ein Erwachsener hat zweihundertsechs Knochen. Babys haben sogar über dreihundert! Manche Knochen wachsen im Lauf der Zeit zusammen. Der kleinste Knochen sitzt im Ohr und ist nur so groß wie ein Reiskorn. Die Muskeln helfen uns, uns zu bewegen. Wenn wir rennen, springen, schreiben oder sogar lächeln, arbeiten unsere Muskeln. Im ganzen Körper gibt es über sechshundert Muskeln. Und ganz oben sitzt das Gehirn. Es ist die Steuerzentrale von allem. Es verarbeitet alles, was wir sehen, hören, riechen und fühlen. Ohne unser Gehirn könnten wir nicht denken, nicht träumen und uns an nichts erinnern.", quiz:[{q:"Wie oft schlägt das Herz ungefähr am Tag?",o:["Tausend Mal","Hunderttausend Mal","Eine Million Mal"],c:1},{q:"Warum haben Babys mehr Knochen als Erwachsene?",o:["Weil sie schneller wachsen","Weil manche Knochen zusammenwachsen","Weil sie kleiner sind"],c:1},{q:"Wo sitzt der kleinste Knochen des Körpers?",o:["Im Fuß","In der Hand","Im Ohr"],c:2}]},
  { date:"2026-03-19", title:"Der Bauernhof", emoji:"🐄", text:"Auf dem Bauernhof von Familie Huber gibt es viele verschiedene Tiere. Die zehn Kühe stehen tagsüber auf der grünen Wiese und fressen frisches Gras. Jeden Morgen und jeden Abend werden sie gemolken. Aus ihrer Milch macht man dann Butter, Käse und Joghurt. Eine Kuh gibt am Tag ungefähr fünfundzwanzig Liter Milch. Das sind fünfundzwanzig volle Milchflaschen! Die Hühner laufen frei auf dem Hof herum und picken nach Körnern und Würmern. Jeden Tag legen sie frische Eier. Der Hahn Karli kräht früh am Morgen laut. Er passt auf seine Hühner auf und warnt sie vor Gefahren. Die Schweine wälzen sich gerne im Schlamm. Das sieht lustig aus, hat aber einen guten Grund: Schweine können nämlich nicht schwitzen wie wir Menschen. Der kühle Schlamm hilft ihnen, sich an heißen Tagen abzukühlen. Außerdem schützt der Schlamm ihre Haut vor Sonnenbrand. Schweine sind übrigens sehr kluge Tiere. Sie können sogar kleine Kunststücke lernen. Bauer Huber steht jeden Tag um fünf Uhr morgens auf. Er füttert die Tiere, melkt die Kühe, sammelt die Eier ein und mistet die Ställe aus. Auf dem Feld baut er Weizen, Kartoffeln und Karotten an. Im Sommer erntet er das Getreide. Aus dem Weizen wird dann Mehl gemacht, und aus Mehl wird Brot gebacken. Ohne Bauern hätten wir kein Essen auf dem Tisch.", quiz:[{q:"Wie viel Milch gibt eine Kuh ungefähr am Tag?",o:["Fünf Liter","Fünfundzwanzig Liter","Hundert Liter"],c:1},{q:"Warum wälzen sich Schweine im Schlamm?",o:["Weil sie schmutzig sein wollen","Um sich abzukühlen und die Haut zu schützen","Weil es ihnen Spaß macht"],c:1},{q:"Warum sind Schweine besondere Tiere?",o:["Sie können fliegen","Sie sind sehr klug","Sie brauchen kein Futter"],c:1}]},
  { date:"2026-03-20", title:"Die Farben der Blätter", emoji:"🍁", text:"Im Sommer sind die Blätter an den Bäumen saftig grün. Aber woher kommt die grüne Farbe eigentlich? Die grüne Farbe kommt von einem Stoff, der Chlorophyll heißt. Dieses Chlorophyll ist wie eine kleine Fabrik im Blatt. Es fängt das Sonnenlicht ein und hilft dem Baum, daraus Nahrung zu machen. Zusammen mit Wasser aus den Wurzeln und einem Gas aus der Luft stellt der Baum sich selbst Zucker her. Davon lebt er. Im Herbst passiert dann etwas Spannendes. Die Tage werden kürzer und es wird kühler. Der Baum merkt: Der Winter kommt! Jetzt braucht er das Chlorophyll nicht mehr, weil die Sonne nicht mehr stark genug scheint. Er zieht die wertvollen Stoffe aus den Blättern zurück in den Stamm und die Wurzeln. Dort bewahrt er sie sicher auf für den nächsten Frühling. Wenn das grüne Chlorophyll langsam verschwindet, werden andere Farben sichtbar, die die ganze Zeit im Blatt versteckt waren: warmes Gelb, leuchtendes Orange und feuriges Rot. Diese Farben waren immer schon da, aber das starke Grün hat sie überdeckt. Zum Schluss trocknen die Blätter aus und fallen vom Baum. Auf dem Boden werden sie langsam von kleinen Tierchen und Pilzen zersetzt. Daraus entsteht gute Erde, die dem Baum im nächsten Jahr wieder als Nahrung dient. So schließt sich der Kreislauf.", quiz:[{q:"Was macht das Chlorophyll im Blatt?",o:["Es macht das Blatt weich","Es hilft dem Baum, aus Sonnenlicht Nahrung zu machen","Es schützt vor Regen"],c:1},{q:"Warum werden die Blätter im Herbst bunt?",o:["Weil sie angemalt werden","Weil das grüne Chlorophyll verschwindet und andere Farben sichtbar werden","Weil es kalt ist"],c:1},{q:"Was passiert mit den Blättern auf dem Boden?",o:["Sie verschwinden einfach","Sie werden zu Erde zersetzt","Sie fliegen weg"],c:1}]},
  { date:"2026-03-21", title:"Post für Leo", emoji:"✉️", text:"Heute hat Leo einen Brief im Briefkasten gefunden. Sein Name steht in großen, schönen Buchstaben auf dem Umschlag. Der Brief ist von seiner Oma, die in einem kleinen Dorf wohnt, weit weg in den Bergen. Leo freut sich riesig, denn Oma schreibt nur selten Briefe. Er nimmt den Brief mit ins Haus und setzt sich an den Küchentisch. Vorsichtig öffnet er den Umschlag. Darin liegt ein Blatt Papier mit Omas schöner, geschwungener Handschrift. Oma erzählt, dass in ihrem Garten schon der Frühling eingezogen ist. Die ersten Krokusse zeigen ihre lila und gelben Köpfe. Die Schneeglöckchen sind auch schon da. Am alten Apfelbaum sitzen zwei Amseln und singen den ganzen Tag. Oma schreibt, dass sie neue Tomatenpflanzen gesetzt hat und hofft, dass es dieses Jahr ganz viele rote Tomaten gibt. Dem Brief liegt auch ein Foto bei. Darauf sieht man Omas Hund Bello. Er sitzt mitten im Garten zwischen den Blumen und hat ein lustiges Gesicht. Seine Zunge hängt heraus und er sieht aus, als würde er grinsen. Leo muss lachen, als er das Foto sieht. Er hängt es an seine Pinnwand über dem Schreibtisch. Dann holt Leo seine Buntstifte und ein großes Blatt Papier. Er will Oma zurückschreiben. Er malt ein Bild von sich und Bello und schreibt darunter: Liebe Oma, ich besuche dich bald! Leo steckt den Brief in einen Umschlag und Papa hilft ihm, eine Briefmarke drauf zu kleben.", quiz:[{q:"Wo wohnt Leos Oma?",o:["In der Stadt","In einem kleinen Dorf in den Bergen","Am Meer"],c:1},{q:"Was macht Leo mit dem Foto von Bello?",o:["Er wirft es weg","Er hängt es an seine Pinnwand","Er gibt es seinem Freund"],c:1},{q:"Was schreibt Leo unter sein Bild?",o:["Danke für den Brief","Liebe Oma, ich besuche dich bald!","Hallo Bello"],c:1}]},
  { date:"2026-03-22", title:"Wie entsteht ein Gewitter?", emoji:"⛈️", text:"An heißen Sommertagen kann es zu Gewittern kommen. Aber wie entsteht so ein Gewitter eigentlich? Alles beginnt mit warmer Luft. Wenn die Sonne den Boden erhitzt, steigt die warme Luft schnell nach oben. Oben in der Höhe wird sie kalt. Aus dem Wasserdampf in der warmen Luft entstehen große, dunkle Wolken. Diese Gewitterwolken können riesig werden. Manche sind über zehn Kilometer hoch, das ist höher als die höchsten Berge der Welt! In den Wolken herrscht ein wildes Durcheinander. Kleine Eisteilchen und Wassertropfen bewegen sich schnell auf und ab. Dabei stoßen sie immer wieder zusammen. Durch diese Zusammenstöße entsteht elektrische Ladung. Oben in der Wolke sammelt sich positive Ladung, unten negative. Wenn der Unterschied zwischen oben und unten stark genug ist, gibt es einen gewaltigen Funken: den Blitz! Ein Blitz ist unvorstellbar heiß. Er ist fünfmal heißer als die Oberfläche der Sonne! Der Blitz erhitzt die Luft um ihn herum so stark und so schnell, dass die Luft sich explosionsartig ausdehnt. Das erzeugt den lauten Knall, den wir als Donner hören. Man sieht den Blitz immer vor dem Donner. Das liegt daran, dass Licht viel schneller ist als Schall. Wenn du die Sekunden zwischen Blitz und Donner zählst und durch drei teilst, weißt du ungefähr, wie viele Kilometer das Gewitter entfernt ist.", quiz:[{q:"Wie heiß ist ein Blitz ungefähr?",o:["So heiß wie kochendes Wasser","Fünfmal heißer als die Oberfläche der Sonne","Hundert Grad"],c:1},{q:"Wie kann man herausfinden, wie weit ein Gewitter weg ist?",o:["Man misst die Lautstärke des Donners","Man zählt die Sekunden zwischen Blitz und Donner und teilt durch drei","Man schaut wie hell der Blitz ist"],c:1},{q:"Wodurch entsteht die elektrische Ladung in den Wolken?",o:["Durch den Wind","Durch zusammenstoßende Eisteilchen und Wassertropfen","Durch die Sonne"],c:1}]},
  { date:"2026-03-23", title:"Die Ameisen", emoji:"🐜", text:"Ameisen sind winzig klein, aber unglaublich stark. Eine einzige Ameise kann das Fünfzigfache ihres eigenen Gewichts tragen! Stell dir vor, du könntest ein ganzes Auto hochheben. So stark wäre ein Mensch, wenn er so kräftig wäre wie eine Ameise. Ameisen leben in riesigen Gruppen zusammen. Manche Ameisenkolonien haben mehrere Millionen Bewohner. Ihre Wohnung unter der Erde heißt Ameisenbau oder Ameisenhügel. Von außen sieht man nur einen kleinen Hügel aus Erde und Tannennadeln. Aber darunter gibt es ein riesiges System aus Gängen und Kammern. Es gibt Kammern zum Schlafen, Kammern für die Eier, Kammern für die Vorräte und sogar Kammern für den Müll. Jede Ameise hat eine feste Aufgabe. Die Arbeiterinnen suchen draußen nach Futter. Die Soldaten beschützen den Bau mit ihren großen Kiefern. Ammen kümmern sich um die Eier und die Larven. Die Ameisenkönigin ist die wichtigste Ameise. Sie legt die Eier und kann über zwanzig Jahre alt werden. Ameisen sprechen nicht mit Wörtern, aber sie können sich trotzdem verständigen. Sie benutzen dafür Duftstoffe, die man Pheromone nennt. Wenn eine Ameise einen leckeren Brotkrümel findet, legt sie auf dem Rückweg eine Duftspur. Alle anderen Ameisen folgen dann dieser Spur und finden den Weg zum Futter. Deshalb sieht man Ameisen oft in langen Reihen hintereinander laufen.", quiz:[{q:"Wie stark wäre ein Mensch, wenn er so kräftig wie eine Ameise wäre?",o:["Er könnte einen Stein heben","Er könnte ein Auto hochheben","Er könnte einen Berg versetzen"],c:1},{q:"Wie alt kann eine Ameisenkönigin werden?",o:["Ein Jahr","Über zwanzig Jahre","Hundert Jahre"],c:1},{q:"Warum laufen Ameisen oft in einer Reihe hintereinander?",o:["Weil sie sich gerne anstellen","Weil sie einer Duftspur folgen","Weil sie sonst den Weg verlieren"],c:1}]},
  { date:"2026-03-24", title:"Das Auge", emoji:"👁️", text:"Unsere Augen sind erstaunliche Organe. Mit ihnen können wir Farben sehen, Gesichter erkennen und sogar lesen. Aber wie funktioniert das eigentlich? Das Licht kommt zuerst durch die Hornhaut. Das ist die durchsichtige Schicht ganz vorne. Dann geht es durch die Pupille ins Auge. Die Pupille ist der schwarze Punkt in der Mitte des Auges. Um die Pupille herum ist die Iris. Das ist der bunte Teil, der bei jedem Menschen eine andere Farbe hat: braun, blau, grün oder grau. Die Iris kann sich zusammenziehen und weiten. Bei Dunkelheit wird die Pupille groß, damit mehr Licht ins Auge kommt. Bei Helligkeit wird sie ganz klein, damit nicht zu viel Licht hereinkommt. Hinter der Pupille liegt die Linse. Sie funktioniert so ähnlich wie die Linse einer Kamera. Sie bündelt das Licht und wirft ein scharfes Bild auf die Netzhaut ganz hinten im Auge. Auf der Netzhaut sitzen Millionen von winzigen Sinneszellen. Manche können Farben erkennen, andere sind für das Sehen bei wenig Licht zuständig. Wusstest du, dass das Bild auf der Netzhaut auf dem Kopf steht? Alles, was wir sehen, kommt dort verkehrt herum an! Aber unser Gehirn ist so schlau, dass es das Bild automatisch wieder richtig herum dreht. Das passiert so schnell, dass wir es gar nicht merken. Unsere Augen können sich übrigens auch sehr schnell bewegen. Sie machen über hunderttausend Bewegungen am Tag!", quiz:[{q:"Was ist die Iris?",o:["Der schwarze Punkt","Der bunte Teil des Auges","Die Augenbraue"],c:1},{q:"Warum wird die Pupille bei Dunkelheit größer?",o:["Damit mehr Licht hineinkommt","Weil sie müde ist","Damit sie besser aussieht"],c:0},{q:"Was passiert mit dem Bild auf der Netzhaut?",o:["Es ist perfekt","Es steht auf dem Kopf","Es ist verschwommen"],c:1}]},
  { date:"2026-03-25", title:"Der Wald bei Nacht", emoji:"🌙", text:"Wenn die Sonne untergeht und es dunkel wird, denken viele Menschen, der Wald schläft ein. Aber das Gegenteil ist der Fall! Nachts wachen ganz besondere Tiere auf. Die Eule sitzt hoch oben auf einem Ast. Mit ihren riesigen Augen kann sie auch bei ganz wenig Licht noch hervorragend sehen. Ihre Augen sind so groß, dass sie nicht mehr in der Augenhöhle bewegt werden können. Dafür kann die Eule ihren Kopf fast komplett herumdrehen, fast dreihundert Grad weit. Ihre Ohren sind ihr Geheimnis: Sie kann eine Maus unter einer dicken Schneeschicht hören! Wenn die Eule fliegt, macht sie fast kein Geräusch. Ihre besonderen Federn schlucken den Schall. So kann sie Mäuse überraschen. Der Dachs kommt bei Einbruch der Dunkelheit aus seinem Bau, der Dachsburg heißt. Dort unten gibt es viele Räume und Gänge. Manche Dachsbauten sind schon über hundert Jahre alt und werden von Generation zu Generation weitergegeben. Der Dachs sucht nach Würmern, Schnecken und Beeren. Fledermäuse flattern zwischen den Bäumen hindurch. Sie sind die einzigen Säugetiere, die wirklich fliegen können. Fledermäuse sehen mit den Ohren. Das klingt verrückt, stimmt aber! Sie senden hohe Töne aus und hören, wo das Echo zurückprallt. So wissen sie genau, wo Bäume, Häuser oder leckere Motten sind. Das nennt man Echoortung. Am Waldboden leuchten manchmal Glühwürmchen wie kleine Laternen. Es sind eigentlich Käfer, die mit einem besonderen chemischen Trick leuchten können.", quiz:[{q:"Warum kann die Eule ihren Kopf so weit drehen?",o:["Weil ihr Hals sehr lang ist","Weil ihre Augen sich nicht bewegen können","Weil sie neugierig ist"],c:1},{q:"Was bedeutet Echoortung bei Fledermäusen?",o:["Sie rufen andere Fledermäuse","Sie senden Töne aus und hören das Echo zurückprallen","Sie benutzen ihre Augen"],c:1},{q:"Wie alt können Dachsbauten werden?",o:["Ein paar Wochen","Über hundert Jahre","Genau zehn Jahre"],c:1}]},
  { date:"2026-03-26", title:"Warum ist der Himmel blau?", emoji:"🔵", text:"Hast du dich schon einmal gefragt, warum der Himmel blau ist und nicht grün oder rot? Die Antwort hat mit dem Sonnenlicht zu tun. Das Sonnenlicht sieht für uns weiß aus. Aber in Wirklichkeit besteht es aus vielen verschiedenen Farben gemischt: Rot, Orange, Gelb, Grün, Blau und Violett. Man kann das sehen, wenn Sonnenlicht durch ein Prisma fällt oder wenn ein Regenbogen entsteht. Jede Farbe hat eine andere Wellenlänge. Rotes Licht hat lange Wellen, blaues Licht hat kurze Wellen. Wenn das Sonnenlicht in unsere Atmosphäre eintritt, also in die Luft um die Erde herum, trifft es auf winzig kleine Teilchen. Das sind Stickstoff- und Sauerstoff-Moleküle. Die blauen Lichtstrahlen mit ihren kurzen Wellen werden von diesen kleinen Teilchen besonders stark in alle Richtungen gestreut. Das bedeutet, egal wohin du am Himmel schaust, von überall kommt blaues Licht zu deinen Augen. Deshalb sieht der ganze Himmel blau aus. Am Morgen und am Abend steht die Sonne tief am Horizont. Dann muss das Licht einen viel längeren Weg durch die Atmosphäre nehmen. Auf diesem langen Weg wird das blaue Licht so stark gestreut, dass es bei uns gar nicht mehr ankommt. Nur noch die langen roten und orangenen Lichtwellen schaffen es bis zu unseren Augen. Darum sehen wir morgens und abends diese wunderschönen roten und orangenen Sonnenauf- und Sonnenuntergänge. Im Weltraum gibt es übrigens keine Luft und keine kleinen Teilchen. Deshalb ist der Himmel dort komplett schwarz, sogar wenn die Sonne scheint.", quiz:[{q:"Welche Lichtstrahlen werden besonders stark gestreut?",o:["Rote mit langen Wellen","Blaue mit kurzen Wellen","Gelbe mit mittleren Wellen"],c:1},{q:"Warum ist der Himmel im Weltraum schwarz?",o:["Weil es dort keine Sonne gibt","Weil es dort keine Luft und keine Teilchen gibt","Weil es dort kalt ist"],c:1},{q:"Was passiert mit dem Licht am Abend?",o:["Es wird stärker","Nur rote und orange Wellen kommen noch an","Es gibt kein Licht mehr"],c:1}]},
  { date:"2026-03-27", title:"Der Zahnarzt", emoji:"🦷", text:"Heute hat Leo einen Termin beim Zahnarzt. Auf dem Weg dorthin hat er ein bisschen Angst. Sein Herz klopft schnell. Aber Papa sagt, es wird nicht schlimm. In der Praxis riecht es nach Minze. An den Wänden hängen bunte Bilder von Tieren. Im Wartezimmer gibt es eine Spielecke mit Bauklötzen. Dann wird Leo aufgerufen. Die Zahnärztin heißt Frau Doktor Weiß. Sie hat ein freundliches Lächeln und trägt einen weißen Kittel. Ihr Behandlungsstuhl ist cool: Er kann hoch und runter fahren und sich sogar nach hinten kippen. Leo findet das lustig. Frau Doktor Weiß erklärt Leo alles, was sie macht, bevor sie es tut. Zuerst schaut sie mit einem kleinen, runden Spiegel in Leos Mund. Dann benutzt sie eine kleine Sonde, um jeden Zahn vorsichtig abzutasten. Sie zählt die Zähne und prüft, ob alles gesund ist. Alles sieht gut aus, kein Loch! Leo ist erleichtert. Dann putzt eine Assistentin Leos Zähne mit einer elektrischen Bürste und einer besonderen Zahnpasta, die nach Erdbeere schmeckt. Frau Doktor Weiß erklärt Leo, wie man richtig Zähne putzt: zweimal am Tag, morgens und abends, jeweils drei Minuten lang. Oben, unten, vorne, hinten und die Seiten. Am besten mit kleinen, kreisenden Bewegungen. Zum Schluss bekommt Leo einen Aufkleber mit einem Drachen drauf und einen kleinen Zahnspiegel für zu Hause. Der Besuch war gar nicht schlimm! Leo freut sich sogar schon ein bisschen auf den nächsten Termin in sechs Monaten.", quiz:[{q:"Wie putzt man die Zähne am besten?",o:["Mit schnellen geraden Bewegungen","Mit kleinen kreisenden Bewegungen","Man muss nur kurz schrubben"],c:1},{q:"Was benutzt die Zahnärztin, um in den Mund zu schauen?",o:["Eine Taschenlampe","Einen kleinen runden Spiegel","Ein Vergrößerungsglas"],c:1},{q:"Wann soll Leo wieder zum Zahnarzt kommen?",o:["Nächste Woche","In sechs Monaten","Erst nächstes Jahr"],c:1}]},
  { date:"2026-03-28", title:"Wasser sparen", emoji:"💦", text:"Wasser ist eines der wichtigsten Dinge auf unserer Erde. Ohne Wasser könnten keine Menschen, Tiere oder Pflanzen leben. Obwohl es auf der Erde sehr viel Wasser gibt, ist das meiste davon Salzwasser in den Meeren. Salzwasser können wir nicht trinken. Nur ein ganz kleiner Teil des Wassers auf der Erde ist Süßwasser, das wir trinken können. Und nicht überall auf der Welt haben die Menschen genug davon. In manchen Ländern müssen Kinder jeden Tag weite Strecken zu einem Brunnen laufen, um Wasser für die Familie zu holen. Deshalb ist es wichtig, dass wir Wasser sparen. Das ist gar nicht so schwer! Beim Zähneputzen kann man den Wasserhahn einfach zudrehen, statt das Wasser die ganze Zeit laufen zu lassen. Allein dadurch spart man mehrere Liter pro Tag. Duschen verbraucht viel weniger Wasser als Baden. Ein Vollbad braucht ungefähr hundertfünfzig Liter. Eine kurze Dusche nur etwa vierzig Liter. Das ist ein großer Unterschied! Im Garten kann man Regenwasser in einer Tonne sammeln und damit die Blumen und Gemüsepflanzen gießen. Auch ein tropfender Wasserhahn verschwendet erstaunlich viel Wasser. Ein einziger tropfender Hahn kann in einem Jahr mehrere tausend Liter Wasser vergeuden. Das ist so viel wie fünfzig volle Badewannen! Wenn jeder Mensch ein bisschen Wasser spart, macht das zusammen einen großen Unterschied für unseren Planeten.", quiz:[{q:"Warum können wir das meiste Wasser auf der Erde nicht trinken?",o:["Weil es zu kalt ist","Weil es Salzwasser ist","Weil es zu tief liegt"],c:1},{q:"Wie viel Wasser braucht man ungefähr für ein Vollbad?",o:["Zehn Liter","Vierzig Liter","Hundertfünfzig Liter"],c:2},{q:"Wie viel Wasser kann ein tropfender Hahn im Jahr vergeuden?",o:["Zehn Liter","Hundert Liter","Mehrere tausend Liter"],c:2}]},
  { date:"2026-03-29", title:"Die Schnecke", emoji:"🐌", text:"Die Schnecke ist ein besonderes Tier. Sie trägt ihr Haus immer auf dem Rücken mit sich herum. In dieses Haus zieht sie sich zurück, wenn sie sich bedroht fühlt oder wenn es draußen zu trocken wird. Das Schneckenhaus besteht aus Kalk und wächst mit der Schnecke mit. Wenn die Schnecke größer wird, wird auch ihr Haus größer. Man kann die Rillen am Haus zählen, fast wie Jahresringe bei einem Baum. Schnecken bewegen sich sehr langsam vorwärts. Unter ihrem Körper ist ein großer, muskulöser Fuß. Dieser Fuß macht wellenartige Bewegungen und schiebt die Schnecke vorwärts. Dabei erzeugt der Fuß eine Schleimschicht. Auf diesem Schleim kann die Schnecke wunderbar gleiten, sogar über scharfe Kanten wie Rasierklingen, ohne sich zu verletzen! Der Schleim schützt ihren weichen Körper. Schnecken haben vier Fühler am Kopf. Die zwei langen Fühler oben tragen an ihren Spitzen die Augen. Mit diesen Augen kann die Schnecke hell und dunkel unterscheiden. Die zwei kürzeren Fühler unten benutzt sie zum Riechen und Tasten. Wenn man einen Fühler berührt, zieht die Schnecke ihn sofort ein. Schnecken fressen am liebsten frische Blätter, Salat und weiches Gemüse. Im Garten sind sie deshalb nicht immer gern gesehen. Manche Schnecken können bis zu fünfzehn Jahre alt werden. Im Winter graben sie sich in die Erde ein und verschließen ihr Haus mit einem Deckel aus getrocknetem Schleim. So überstehen sie die kalte Jahreszeit.", quiz:[{q:"Warum kann die Schnecke über scharfe Kanten gleiten?",o:["Weil sie ein hartes Haus hat","Weil die Schleimschicht ihren Körper schützt","Weil sie sehr leicht ist"],c:1},{q:"Was ist an den Spitzen der langen Fühler?",o:["Die Nase","Die Ohren","Die Augen"],c:2},{q:"Wie übersteht die Schnecke den Winter?",o:["Sie fliegt in den Süden","Sie gräbt sich ein und verschließt ihr Haus","Sie baut ein neues Haus"],c:1}]},
  { date:"2026-03-30", title:"Tag und Nacht", emoji:"🌍", text:"Warum gibt es eigentlich Tag und Nacht? Das hat mit unserer Erde zu tun. Die Erde dreht sich nämlich ständig um sich selbst, wie ein langsamer Kreisel. Für eine vollständige Drehung braucht sie genau vierundzwanzig Stunden, also einen Tag. Die Seite der Erde, die gerade zur Sonne zeigt, hat Tag. Dort ist es hell und warm. Die andere Seite, die von der Sonne weg zeigt, hat Nacht. Dort ist es dunkel. Weil sich die Erde immer weiter dreht, wechseln sich Tag und Nacht ständig ab. Das ist auch der Grund, warum die Sonne am Morgen im Osten aufgeht und am Abend im Westen untergeht. In Wirklichkeit bewegt sich die Sonne gar nicht. Es ist die Erde, die sich dreht! Wenn bei uns in Deutschland Nacht ist und wir im Bett liegen, haben Kinder auf der anderen Seite der Erde gerade Tag. In Australien zum Beispiel gehen die Kinder dann gerade zur Schule oder spielen auf dem Spielplatz. Und wenn bei uns die Sonne aufgeht, gehen die Kinder in Australien ins Bett. Das ist doch erstaunlich! Aber es gibt noch etwas Spannendes: Im Sommer sind die Tage bei uns viel länger als im Winter. Im Juni wird es schon um fünf Uhr morgens hell und erst um zehn Uhr abends dunkel. Im Dezember dagegen wird es erst um acht Uhr hell und schon um vier Uhr nachmittags wieder dunkel. Das liegt daran, dass die Erde ein bisschen schief steht, während sie um die Sonne kreist. Im Sommer ist unsere Seite der Erde mehr zur Sonne geneigt, und im Winter weniger.", quiz:[{q:"Wie lange braucht die Erde für eine Drehung um sich selbst?",o:["Zwölf Stunden","Vierundzwanzig Stunden","Eine Woche"],c:1},{q:"Was machen Kinder in Australien, wenn bei uns Nacht ist?",o:["Sie schlafen auch","Sie gehen zur Schule oder spielen","Sie schauen Sterne"],c:1},{q:"Warum sind die Tage im Sommer länger als im Winter?",o:["Weil die Sonne im Sommer größer ist","Weil die Erde schief steht","Weil die Erde sich im Sommer schneller dreht"],c:1}]},
  { date:"2026-03-31", title:"Leos Monat", emoji:"⭐", text:"Heute ist der letzte Tag im März. Leo sitzt an seinem Schreibtisch und denkt an den ganzen Monat zurück. Er hat so unglaublich viel gelernt! Er weiß jetzt, warum der Himmel blau ist und wie ein wunderschöner Regenbogen entsteht. Er hat über viele verschiedene Tiere gelesen: über den stacheligen Igel, den springenden Frosch, die fleißigen Bienen und die starken Ameisen. Er hat erfahren, wie der menschliche Körper funktioniert und warum Blätter im Herbst ihre Farbe ändern. Er kennt jetzt alle acht Planeten unseres Sonnensystems und weiß, wie der Wasserkreislauf funktioniert. Er hat gelernt, wie Gewitter entstehen und warum Fledermäuse mit den Ohren sehen können. Leo blättert durch sein Lesetagebuch und staunt, wie viele Seiten er schon gelesen hat. Am Anfang des Monats hat er bei manchen Wörtern noch gestockt. Jetzt liest er viel flüssiger und sicherer. Manche Wörter, die er vorher schwierig fand, kann er jetzt ohne Probleme lesen. Papa hat gesagt, er ist sehr stolz auf Leo. Mama hat gesagt, sie merkt, wie viel besser Leo liest. Das macht Leo glücklich. Er hat auch gemerkt, dass Lesen richtig Spaß machen kann, wenn man neugierig ist und jeden Tag ein bisschen übt. Zauberer Merlix hat ihm dabei geholfen und ihn jeden Tag angefeuert. Leo ist stolz auf sich selbst. Er freut sich schon auf den nächsten Monat und auf neue spannende Texte und Abenteuer!", quiz:[{q:"Was hat Leo im März am meisten geholfen beim Lernen?",o:["Viel fernsehen","Jeden Tag ein bisschen üben und neugierig sein","Nur am Wochenende lesen"],c:1},{q:"Was hat sich bei Leo über den Monat verändert?",o:["Er liest jetzt viel flüssiger und sicherer","Er mag kein Lesen mehr","Nichts hat sich verändert"],c:0},{q:"Worüber hat Leo im März NICHT gelesen?",o:["Planeten und Sonnensystem","Dinosaurier und Vulkane","Ameisen und Bienen"],c:1}]}

function getToday(){return new Date().toISOString().slice(0,10);}
function getDayLabel(d){const dt=new Date(d+'T12:00:00');const wd=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];return wd[dt.getDay()]+', '+dt.getDate()+'. März';}
function getCompleted(){return DAYS.filter(d=>progress[d.date]?.quizDone).length;}
function getTotalStars(){return DAYS.reduce((s,d)=>s+(progress[d.date]?.score||0),0)+(progress.mathStars||0)+(progress.engStars||0)+(progress.wissenStars||0)+(progress.schreibStars||0);}
function getLevel(){const c=getCompleted();let l=LEVELS[0];for(const lv of LEVELS){if(c>=lv.min)l=lv;}return l;}
function getStreak(){const today=getToday();let s=0;for(let i=DAYS.length-1;i>=0;i--){if(DAYS[i].date>today)continue;if(progress[DAYS[i].date]?.quizDone)s++;else break;}return s;}
function pickRandom(a){return a[Math.floor(Math.random()*a.length)];}
function formatText(t){const s=t.match(/[^.!?]+[.!?]+/g)||[t];let p=[];let c=[];for(let i=0;i<s.length;i++){c.push(s[i].trim());if(c.length>=3||i===s.length-1){p.push(c.join(' '));c=[];}}return p.map(x=>`<p style="margin:0 0 16px 0">${x}</p>`).join('');}

function spawnConfetti(n){const c=['#fbbf24','#7c3aed','#34d399','#f87171','#60a5fa','#f472b6','#fb923c'];for(let i=0;i<n;i++){const el=document.createElement('div');el.className='confetti';el.style.cssText=`left:${Math.random()*100}%;top:-20px;background:${pickRandom(c)};--dur:${1.5+Math.random()*2}s;--rot:${360+Math.random()*720}deg;animation-delay:${Math.random()*0.8}s;border-radius:${Math.random()>0.5?'50%':'2px'};width:${6+Math.random()*6}px;height:${10+Math.random()*8}px;`;document.body.appendChild(el);setTimeout(()=>el.remove(),4000);}}

function merlixCrazyEffect(effect){
  const body=document.body;
  const app=document.getElementById('app');
  switch(effect){
    case 'colorshift':
      body.style.transition='background 0.5s';
      const colors=['#1a0a2e','#0a2e1a','#2e0a1a','#0a1a2e','#2e2e0a'];
      body.style.background=pickRandom(colors);
      setTimeout(()=>{body.style.background='';body.style.transition='';},2500);
      spawnParticles(25,['#ff0','#0ff','#f0f','#0f0']);
      break;
    case 'explosion':
      spawnConfetti(80);
      spawnStarBurst();
      spawnParticles(40,['#fbbf24','#ef4444','#f97316','#7c3aed','#06b6d4']);
      setTimeout(()=>spawnConfetti(40),500);
      break;
    case 'confetti':
      spawnConfetti(100);
      setTimeout(()=>spawnConfetti(60),400);
      setTimeout(()=>spawnConfetti(40),800);
      break;
    case 'shake':
      app.style.transition='none';
      let shakeCount=0;
      const shakeInterval=setInterval(()=>{
        const x=(Math.random()-0.5)*16;const y=(Math.random()-0.5)*10;
        app.style.transform=`translate(${x}px,${y}px)`;
        shakeCount++;
        if(shakeCount>20){clearInterval(shakeInterval);app.style.transform='';} 
      },50);
      spawnParticles(20,['#f87171','#fbbf24','#a78bfa']);
      break;
    case 'invert':
      body.style.transition='filter 0.3s';
      body.style.filter='invert(1) hue-rotate(180deg)';
      setTimeout(()=>{body.style.filter='invert(0.5) hue-rotate(90deg)';},800);
      setTimeout(()=>{body.style.filter='';body.style.transition='';},2000);
      spawnParticles(15,['#fff','#000','#888']);
      break;
    case 'rainbow':
      const rainbowEl=document.createElement('div');
      rainbowEl.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;z-index:997;pointer-events:none;opacity:0.3;background:linear-gradient(45deg,red,orange,yellow,green,blue,indigo,violet,red);background-size:400% 400%;animation:rainbowBg 2s linear forwards;';

      setTimeout(()=>{rainbowEl.remove();style.remove();},2500);
      break;
    case 'freeze':
      body.style.transition='filter 0.5s, background 0.5s';
      body.style.filter='brightness(1.3) saturate(0.3) hue-rotate(200deg)';
      body.style.background='#0a1a3e';
      spawnParticles(30,['#a5f3fc','#e0f2fe','#bae6fd','#fff']);
      // Spawn snowflakes
      for(let i=0;i<20;i++){
        const sf=document.createElement('div');
        sf.className='confetti';
        sf.textContent='❄️';
        sf.style.cssText=`left:${Math.random()*100}%;top:-20px;background:transparent;font-size:${12+Math.random()*16}px;--dur:${2+Math.random()*3}s;--rot:${Math.random()*360}deg;animation-delay:${Math.random()*1}s;width:auto;height:auto;`;

        setTimeout(()=>sf.remove(),5000);
      }
      setTimeout(()=>{body.style.filter='';body.style.background='';body.style.transition='';},3000);
      break;
    case 'fire':
      body.style.transition='background 0.5s';
      body.style.background='linear-gradient(to top, #1a0000, #3d0000, #0a0e1a)';
      spawnParticles(40,['#ef4444','#f97316','#fbbf24','#dc2626']);

      setTimeout(()=>{body.style.background='';body.style.transition='';},3000);

const WALK_TYPES=['bottom','top','diagonal','bounce','zoom','monster','summon'];
const MONSTERS=['🐉','👾','👻','🦖','🐲','👹'];
const SUMMONS=['🦄','🐉','🦅','🐺','🦁','🐸','🦋','🌈'];

function merlixWalk(){
  if(document.querySelector('.merlix-walker'))return;
  const spell=pickRandom(MERLIX_CRAZY_SPELLS);
  const walkType=pickRandom(WALK_TYPES);

  if(walkType==='monster'){
    // Monster chases Merlix!
    const monster=pickRandom(MONSTERS);
    const w=document.createElement('div');
    w.className='merlix-walker';
    w.textContent='🧙‍♂️';
    w.style.fontSize='55px';
    w.style.animation='wizRunScared 5s linear forwards';
    document.body.appendChild(w);
    // Monster follows behind
    const m=document.createElement('div');
    m.className='monster-chaser';
    m.textContent=monster;
    m.style.animation='monsterChase 5.5s linear 0.4s forwards';
    document.body.appendChild(m);
    // Merlix yells
    setTimeout(()=>{
      const yell=document.createElement('div');
      yell.className='merlix-spell';
      yell.textContent=pickRandom(['😱 HIILFE!','🏃 Renn, Merlix!','😰 Ein '+monster+'!','💨 Schneller!!','😱 AAAH!']);
      yell.style.left='calc(50% - 80px)';yell.style.bottom='90px';
      document.body.appendChild(yell);
      spawnParticles(20,['#ef4444','#fbbf24','#f97316']);
      setTimeout(()=>yell.remove(),2500);
    },2000);
    // Merlix fights back at the end
    setTimeout(()=>{
      const fightSpell=document.createElement('div');
      fightSpell.className='merlix-spell';
      fightSpell.textContent=pickRandom(['⚡ NIMM DAS!','🔥 Feuerzauber!','💫 Verschwinde!','✨ PENG!']);
      fightSpell.style.left='70%';fightSpell.style.bottom='90px';
      document.body.appendChild(fightSpell);
      spawnConfetti(40);
      spawnParticles(30,['#7c3aed','#fbbf24','#ef4444','#22c55e']);
      setTimeout(()=>fightSpell.remove(),2500);
    },4000);
    setTimeout(()=>{w.remove();m.remove();},6000);

  } else if(walkType==='summon'){
    // Merlix summons a creature!
    const w=document.createElement('div');
    w.className='merlix-walker';
    w.textContent='🧙‍♂️';
    w.style.animation='wizWalkBottom 6s linear forwards';
    document.body.appendChild(w);
    setTimeout(()=>{
      const spellEl=document.createElement('div');
      spellEl.className='merlix-spell';
      spellEl.textContent=pickRandom(['🌟 Erscheine!','✨ Komm hervor!','💫 Beschwörung!','⚡ Manifestiere dich!']);
      spellEl.style.left='calc(50% - 80px)';spellEl.style.bottom='90px';
      document.body.appendChild(spellEl);
      setTimeout(()=>spellEl.remove(),2500);
      // Summon creature
      const creature=document.createElement('div');
      creature.className='summoned-creature';
      creature.textContent=pickRandom(SUMMONS);
      creature.style.fontSize='80px';
      creature.style.left='calc(50% - 40px)';
      creature.style.top='calc(50% - 60px)';
      document.body.appendChild(creature);
      spawnStarBurst();
      spawnParticles(30,['#fbbf24','#a78bfa','#34d399','#ec4899']);
      setTimeout(()=>{spawnConfetti(30);},1000);
      setTimeout(()=>creature.remove(),3200);
    },2500);
    setTimeout(()=>w.remove(),6200);

  } else {
    // Regular walks with different paths
    const w=document.createElement('div');
    w.className='merlix-walker';
    w.textContent='🧙‍♂️';
    const anims={
      bottom:'wizWalkBottom 6s linear forwards',
      top:'wizWalkTop 6s linear forwards',
      diagonal:'wizWalkDiag 5s linear forwards',
      bounce:'wizBounce 5.5s ease-in-out forwards',
      zoom:'wizZoom 4s ease-in-out forwards',
    };
    w.style.animation=anims[walkType]||anims.bottom;
    if(walkType==='zoom')w.style.fontSize='70px';
    document.body.appendChild(w);
    // Cast spell at midpoint
    const spellDelay=walkType==='zoom'?1800:2800;
    setTimeout(()=>{
      const spellEl=document.createElement('div');
      spellEl.className='merlix-spell';
      spellEl.textContent=spell.name;
      spellEl.style.left='calc(50% - 80px)';
      spellEl.style.cssText+=walkType==='top'?'top:120px;bottom:auto;':'bottom:90px;';
      document.body.appendChild(spellEl);
      merlixCrazyEffect(spell.effect);
      setTimeout(()=>spellEl.remove(),2500);
    },spellDelay);
    const dur=walkType==='zoom'?4200:walkType==='diagonal'?5200:6200;
    setTimeout(()=>w.remove(),dur);
  }
  scheduleMerlixWalk();
}
function scheduleMerlixWalk(){
  if(merlixTimeout)clearTimeout(merlixTimeout);
  merlixTimeout=setTimeout(merlixWalk,18000+Math.random()*22000);
}

// ─── Math Generation ────────────────────────────────────────────────────
function generateMathProblems(){
  const problems=[];
  for(let i=0;i<8;i++){
    const type=Math.random();
    let a,b,op,answer;
    if(type<0.35){// addition
      a=Math.floor(Math.random()*50)+1;b=Math.floor(Math.random()*(100-a))+1;
      op='+';answer=a+b;
    }else if(type<0.7){// subtraction
      a=Math.floor(Math.random()*80)+20;b=Math.floor(Math.random()*a)+1;
      op='−';answer=a-b;
    }else{// multiplication (small)
      a=Math.floor(Math.random()*9)+2;b=Math.floor(Math.random()*9)+2;
      op='×';answer=a*b;
    }
    problems.push({a,b,op,answer,text:`${a} ${op} ${b} = ?`});
  }
  return problems;
}
