<title>Uhr-Trainer für Leo</title>
<style>
  :root{
    color-scheme: light only;
    --ink:#141414; --hour:#c81e3a; --min:#1257b0; --pie:#bcd6f2;
    --line:#d8d8d8; --soft:#f2f6fb;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{background:#fff !important; color:var(--ink) !important; margin:0; padding:0}
  body{
    font-family:"Verdana",system-ui,-apple-system,sans-serif;
    padding:14px 14px 34px; max-width:520px; margin:0 auto;
    -webkit-user-select:none; user-select:none; touch-action:manipulation;
  }
  h1{font-size:20px; margin:0 0 10px; text-align:center}
  .tabs{display:flex; gap:6px; margin-bottom:12px}
  .tab{
    flex:1; border:2px solid var(--line); background:#fff; color:#666;
    border-radius:10px; padding:9px 2px; font:700 13px/1.2 inherit; cursor:pointer;
  }
  .tab.on{border-color:var(--min); background:var(--min); color:#fff}
  .hint{background:var(--soft); border:2px solid #cfe0f2; border-radius:12px;
        padding:9px 12px; font-size:14px; line-height:1.45; margin:0 0 12px}
  .stage{text-align:center}
  svg{width:100%; max-width:330px; height:auto; touch-action:none}
  .read{margin:12px 0 4px; text-align:center}
  .big{font-size:30px; font-weight:700; line-height:1.15}
  .sub{font-size:15px; color:#555; line-height:1.5; margin-top:6px; min-height:44px}
  .sub b{color:var(--ink)}
  .pad{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px}
  button.ctl{
    border:2px solid var(--ink); background:#fff; color:var(--ink);
    border-radius:12px; padding:15px 6px; font:700 16px/1.1 inherit; cursor:pointer;
  }
  button.ctl:active{background:#eee}
  button.ctl.wide{grid-column:1 / -1}
  button.ctl.go{background:var(--min); border-color:var(--min); color:#fff}
  .label{font-size:12px; color:#777; text-align:center; margin:12px 0 -4px}
  .verdict{font-size:19px; font-weight:700; text-align:center; margin-top:12px; min-height:26px}
  .ok{color:#1a7a3c} .no{color:var(--hour)}
  .score{text-align:center; font-size:14px; color:#666; margin-top:4px}
</style>
</head>
<body>

<h1>Uhr-Trainer</h1>

<div class="tabs">
  <button class="tab on" data-mode="1">1 Kuchen</button>
  <button class="tab" data-mode="2">2 Wanderer</button>
  <button class="tab" data-mode="3">3 Zusammen</button>
  <button class="tab" data-mode="4">Üben</button>
</div>

<p class="hint" id="hint"></p>

<div class="stage"><svg id="clock" viewBox="0 0 200 200"></svg></div>

<div class="read">
  <div class="big" id="big"></div>
  <div class="sub" id="sub"></div>
</div>

<div class="verdict" id="verdict"></div>
<div class="score" id="score"></div>

<div class="pad" id="pad"></div>

<script>
(function(){
  var HOUR="#c81e3a", MIN="#1257b0", PIE="#bcd6f2", INK="#141414";
  var mode=1, h=3, m=0;
  var target=null, richtig=0, gesamt=0;

  var svg=document.getElementById('clock');
  var elHint=document.getElementById('hint'), elBig=document.getElementById('big'),
      elSub=document.getElementById('sub'), elPad=document.getElementById('pad'),
      elVer=document.getElementById('verdict'), elScore=document.getElementById('score');

  var WORT={0:'voll',15:'Viertel',30:'halb',45:'dreiviertel'};

  function naechste(x){ return x%12+1; }
  function zeit(h,m){
    if(m===0)  return h+' Uhr';
    if(m===15) return 'Viertel nach '+h;
    if(m===30) return 'halb '+naechste(h);
    return 'Viertel vor '+naechste(h);
  }
  function pol(r,deg){
    var a=deg*Math.PI/180;
    return [100+r*Math.sin(a), 100-r*Math.cos(a)];
  }
  function pie(min){
    if(min<=0) return '';
    var r=84, deg=min*6, p=pol(r,deg), gross=deg>180?1:0;
    return '<path d="M100,100 L100,'+(100-r)+' A'+r+','+r+' 0 '+gross+',1 '+
           p[0].toFixed(2)+','+p[1].toFixed(2)+' Z" fill="'+PIE+'"/>';
  }

  function zeichne(){
    var zahlen = (mode!==1);
    var zeigerH = (mode!==1);
    var zeigerM = (mode!==2);
    var s='';
    s+='<circle cx="100" cy="100" r="88" fill="#fff"/>';
    if(zeigerM) s+=pie(m);
    for(var q=0;q<4;q++){
      var p=pol(84,q*90);
      s+='<line x1="100" y1="100" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+
         '" stroke="#8fa8bf" stroke-width="1.6" stroke-dasharray="4 4"/>';
    }
    s+='<circle cx="100" cy="100" r="88" fill="none" stroke="'+INK+'" stroke-width="4"/>';
    for(var i=0;i<12;i++){
      var a=pol(86,i*30), b=pol(78,i*30);
      s+='<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+
         '" y2="'+b[1].toFixed(1)+'" stroke="'+INK+'" stroke-width="3" stroke-linecap="round"/>';
    }
    if(zahlen){
      for(var n=1;n<=12;n++){
        var p2=pol(66,n*30);
        s+='<text x="'+p2[0].toFixed(1)+'" y="'+p2[1].toFixed(1)+'" text-anchor="middle" '+
           'dominant-baseline="central" font-size="24" font-weight="700" font-family="Verdana,sans-serif" fill="'+HOUR+'">'+n+'</text>';
      }
    }
    if(zeigerM){
      var pm=pol(74,m*6);
      s+='<line x1="100" y1="100" x2="'+pm[0].toFixed(1)+'" y2="'+pm[1].toFixed(1)+
         '" stroke="'+MIN+'" stroke-width="6" stroke-linecap="round"/>';
    }
    if(zeigerH){
      var ph=pol(46,(h%12)*30+m*0.5);
      s+='<line x1="100" y1="100" x2="'+ph[0].toFixed(1)+'" y2="'+ph[1].toFixed(1)+
         '" stroke="'+HOUR+'" stroke-width="11" stroke-linecap="round"/>';
    }
    s+='<circle cx="100" cy="100" r="7" fill="'+INK+'"/>';
    svg.innerHTML=s;
  }

  function text(){
    var ziel=naechste(h);
    if(mode===1){
      elBig.textContent=WORT[m];
      elSub.innerHTML = m===0 ? 'Der Kuchen ist noch ganz.'
                              : 'Von der Stunde ist <b>'+WORT[m]+'</b> schon weg.';
    } else if(mode===2){
      elBig.textContent='von '+h+' nach '+ziel;
      elSub.innerHTML='Der kleine Zeiger ist unterwegs. Sein Ziel ist die <b>'+ziel+'</b>.';
    } else if(mode===3){
      elBig.textContent=zeit(h,m);
      elSub.innerHTML='Kleiner Zeiger: von '+h+' nach '+ziel+'.<br>Kuchen: '+WORT[m]+'.';
    } else {
      elBig.textContent = target ? 'Stell ein: '+zeit(target[0],target[1]) : '';
      elSub.innerHTML='Dein Vorschlag: <b>'+zeit(h,m)+'</b>';
    }
  }

  function hinweis(){
    var t=['Der kleine Zeiger ist weg. Schau nur, wie viel vom Kuchen blau ist.',
           'Der große Zeiger ist weg. Frag nur: von welcher Zahl nach welcher Zahl?',
           'Jetzt beides. Erst der kleine Zeiger, dann der Kuchen.',
           'Stell die Uhr ein und drücke auf Prüfen.'];
    elHint.textContent=t[mode-1];
  }

  function pad(){
    var b='';
    if(mode===1){
      b+='<button class="ctl" data-a="m-">◀ zurück</button>'+
         '<button class="ctl go" data-a="m+">weiter ▶</button>';
    } else if(mode===2){
      b+='<button class="ctl" data-a="h-">◀ zurück</button>'+
         '<button class="ctl go" data-a="h+">weiter ▶</button>';
    } else {
      b+='<button class="ctl" data-a="h-">Stunde ◀</button>'+
         '<button class="ctl" data-a="h+">Stunde ▶</button>'+
         '<button class="ctl" data-a="m-">Kuchen ◀</button>'+
         '<button class="ctl" data-a="m+">Kuchen ▶</button>';
      if(mode===4) b+='<button class="ctl go wide" data-a="check">Prüfen</button>';
    }
    elPad.innerHTML=b;
  }

  function neu(){
    var vs=[0,15,30,45];
    var nh, nm, i=0;
    do{ nh=1+Math.floor(Math.random()*12); nm=vs[Math.floor(Math.random()*4)]; i++; }
    while(target && nh===target[0] && nm===target[1] && i<20);
    target=[nh,nm];
    elVer.textContent='';
  }

  function pruefe(){
    gesamt++;
    if(h===target[0] && m===target[1]){
      richtig++;
      elVer.textContent='Richtig!'; elVer.className='verdict ok';
      setTimeout(function(){ neu(); render(); }, 1100);
    } else {
      elVer.textContent='Noch nicht. Schau nochmal.'; elVer.className='verdict no';
    }
    elScore.textContent=richtig+' von '+gesamt+' richtig';
  }

  function render(){ zeichne(); text(); }

  elPad.addEventListener('click', function(e){
    var b=e.target.closest('button[data-a]'); if(!b) return;
    var a=b.getAttribute('data-a');
    if(a==='m+'){ m+=15; if(m>45){ m=0; h=naechste(h); } }
    if(a==='m-'){ m-=15; if(m<0){ m=45; h=(h+10)%12+1; } }
    if(a==='h+'){ h=naechste(h); }
    if(a==='h-'){ h=(h+10)%12+1; }
    if(a==='check'){ pruefe(); render(); return; }
    if(mode===4) elVer.textContent='';
    render();
  });

  document.querySelector('.tabs').addEventListener('click', function(e){
    var b=e.target.closest('.tab'); if(!b) return;
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('on'); });
    b.classList.add('on');
    mode=parseInt(b.getAttribute('data-mode'),10);
    elVer.textContent=''; elScore.textContent='';
    if(mode===4){ richtig=0; gesamt=0; target=null; neu(); }
    hinweis(); pad(); render();
  });

  // Zeiger ziehen
  function ausEvent(ev){
    var r=svg.getBoundingClientRect();
    var pt=ev.touches ? ev.touches[0] : ev;
    var x=pt.clientX-r.left-r.width/2, y=pt.clientY-r.top-r.height/2;
    if(Math.abs(x)<6 && Math.abs(y)<6) return;
    var deg=(Math.atan2(x,-y)*180/Math.PI+360)%360;
    var v=Math.round(deg/90)%4;
    if(mode===2){
      var nh=Math.round(deg/30); if(nh===0) nh=12;
      h=nh;
    } else {
      m=v*15;
    }
    if(mode===4) elVer.textContent='';
    render();
  }
  var zieht=false;
  svg.addEventListener('pointerdown', function(e){ zieht=true; svg.setPointerCapture(e.pointerId); ausEvent(e); });
  svg.addEventListener('pointermove', function(e){ if(zieht) ausEvent(e); });
  svg.addEventListener('pointerup', function(){ zieht=false; });
  svg.addEventListener('pointercancel', function(){ zieht=false; });

  hinweis(); pad(); render();
})();
</script>
</body>
</html>
